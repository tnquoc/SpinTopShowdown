setView(view);
$('story').addEventListener('click', nextLine);
$('storyHint').textContent = t('Bấm chuột hoặc Space để tiếp', 'Click or press Space to continue');
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (storyOpen()) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); nextLine(); } return; }
  if (e.code === 'Space') { e.preventDefault(); state === 'shop' ? launch() : powerPress(); }
  else if (e.code === 'KeyV') toggleView();
  else if (e.code === 'Enter' && state === 'result') $('rNext').classList.contains('hidden') ? enterShop() : setLevel(levelIndex + 1);
});

// drag on the arena: press sets the drop point, dragging sets the launch velocity
const ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitPt = new THREE.Vector3();
const aimArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(), 1, 0xffd23f, .7, .45);
scene.add(aimArrow);
let aiming = false;
function arenaPoint(e) {
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  return ray.ray.intersectPlane(ground, hitPt);
}
const aimKnob = new THREE.Mesh(new THREE.SphereGeometry(.27, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffd23f }));
scene.add(aimKnob);
const aimY = () => floorY(player.x, player.z) + player.height + .3;
let dragMode = null;     // 'aim' while pulling the arrow, 'move' while placing the top
function moveDrop() {
  const drop = dropPt();
  if (level.track) {                       // only the green start pad is a legal drop zone
    drop.z = clamp(hitPt.z, -1.5, 2);
    const c = trackSample(-drop.z).cx, hw = ts.hw;
    drop.x = clamp(hitPt.x, c - hw + 1, c + hw - 1);
  } else {
    const d = Math.hypot(hitPt.x, hitPt.z), lim = level.R - 1.5, k = d > lim ? lim / d : 1;
    drop.x = hitPt.x * k; drop.z = hitPt.z * k;
  }
  player.x = drop.x; player.z = drop.z;
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (state !== 'shop') return;
  const drop = dropPt(), aim = aimVec();
  // pressing on the top or on the arrow's knob pulls the arrow and never moves the top
  ground.constant = -aimY();
  if (arenaPoint(e)) {
    const onTop = Math.hypot(hitPt.x - drop.x, hitPt.z - drop.z) < player.r + .9;
    const onKnob = Math.hypot(aim.x, aim.z) > .3 && Math.hypot(hitPt.x - drop.x - aim.x, hitPt.z - drop.z - aim.z) < 1;
    if (onTop || onKnob) { dragMode = 'aim'; return; }
  }
  ground.constant = 0;
  if (!arenaPoint(e)) return;
  if (level.track ? Math.abs(hitPt.z) > 4 : Math.hypot(hitPt.x, hitPt.z) > level.R + 2) return;
  dragMode = 'move';
  moveDrop();                              // the arrow keeps its direction and length
});
addEventListener('pointermove', e => {
  if (!dragMode) return;
  ground.constant = dragMode === 'aim' ? -aimY() : 0;
  if (!arenaPoint(e)) return;
  if (dragMode === 'move') return moveDrop();
  let ax = hitPt.x - dropPt().x, az = hitPt.z - dropPt().z;
  const len = Math.hypot(ax, az);
  if (len < .5) ax = az = 0;               // dropped back onto the top: no launch push
  else if (len > 6) { ax *= 6 / len; az *= 6 / len; }
  aimVec().x = ax; aimVec().z = az;
});
addEventListener('pointerup', () => { dragMode = null; });

// ---------- per-frame visuals ----------
const proj = new THREE.Vector3();
function popup(x, y, z, text) {
  if (headless) return;
  proj.set(x, y + 1, z).project(camera);
  if (proj.z > 1) return;
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text;
  el.style.left = (proj.x + 1) / 2 * innerWidth + 'px'; el.style.top = (1 - proj.y) / 2 * innerHeight + 'px';
  $('pops').appendChild(el); setTimeout(() => el.remove(), 800);
}
function announce(text) {
  if (headless) return;
  const el = $('announce'); el.textContent = text;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}

const EDGE_RED = new THREE.Color(0xff4d4d), SUN_OFFSET = new THREE.Vector3(8, 22, 10);
const camPos = new THREE.Vector3(0, 16, 10), camLook = new THREE.Vector3(), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
let orbit = 0, fpAim = 0;

function visuals(dt) {
  realT += dt;
  const fighting = state === 'battle' || state === 'ending';
  tops.forEach((a, i) => {
    const sp = Math.abs(a.w);
    if (a.alive) {
      a.angle += (fighting ? a.w : sgn(a.w) * 14) * dt;
      a.tiltAmp += ((fighting ? .03 + clamp((32 - sp) / 32, 0, 1) * .42 : .03) - a.tiltAmp) * Math.min(1, dt * 6);
      a.phase += dt * precession(sp, a.r) * 3;
      if (a.yOff > 0 && !level.track) { a.vy -= 40 * dt; a.yOff = Math.max(0, a.yOff + a.vy * dt); if (a.yOff === 0) a.vy = 0; }
    } else if (a.why === 'ring') {
      a.vy -= 28 * dt; a.yOff += a.vy * dt; a.x += a.vx * dt; a.z += a.vz * dt; a.angle += a.w * dt;
      a.tiltAmp = Math.min(1.2, a.tiltAmp + dt * 2);
    } else {
      a.tiltAmp += (1.35 - a.tiltAmp) * Math.min(1, dt * 5);
      a.x += a.vx * dt; a.z += a.vz * dt; a.vx *= .94; a.vz *= .94;
    }
    a.g.visible = a.yOff > -25;
    a.aura.material.opacity = a.alive ? .12 + .45 * clamp(sp / a.w0, 0, 1) : 0;
    a.g.position.set(a.x, (a.why === 'ring' ? a.fallY : floorY(a.x, a.z)) + a.yOff, a.z);
    a.tiltG.rotation.set(Math.cos(a.phase) * a.tiltAmp, 0, Math.sin(a.phase) * a.tiltAmp);
    a.spinG.rotation.y = a.angle;
    // trail
    const p = a.trail.geometry.attributes.position, arr = p.array;
    if (fighting && a.alive) { arr.copyWithin(3, 0, (TRAIL - 1) * 3); arr[0] = a.x; arr[1] = floorY(a.x, a.z) + .06; arr[2] = a.z; }
    else if (!fighting) for (let k = 0; k < TRAIL; k++) { arr[k * 3] = a.x; arr[k * 3 + 1] = floorY(a.x, a.z) + .06; arr[k * 3 + 2] = a.z; }
    p.needsUpdate = true;
    // tornado
    if (a.stormT > 0) {
      if (!a.cone) a.cone = makeFunnel(0xffffff);
      const big = 1 + .35 * (a.stormLv - 1);
      const y = floorY(a.x, a.z), grow = Math.min(1, (a.stormDur - a.stormT) * 4) * big;
      a.cone.material.color.setHex(a.isPlayer || a.stormLv > 1 ? STORM_COLORS[a.stormLv - 1] : a.color);
      a.cone.visible = true; a.cone.position.set(a.x, y + 3.75 * grow, a.z); a.cone.scale.setScalar(grow);
      a.cone.material.map.offset.x -= dt * 2.5 * sgn(a.w); a.cone.material.map.offset.y -= dt * .8;
      for (let k = 0; k < 7 * a.stormLv; k++) {
        const h = rand(0, 7 * big), ang = rand(0, 6.28), rr = .6 + h * .55, s = (5 + h) * sgn(a.w);
        spark(a.x + Math.cos(ang) * rr, y + h, a.z + Math.sin(ang) * rr, -Math.sin(ang) * s, rand(2, 6), Math.cos(ang) * s, rand(.3, .6), .6, .8, 1, 0);
      }
      shake = Math.max(shake, .12);
    } else if (a.cone) a.cone.visible = false;
    skillVisuals(a, dt);
    // roster
    const row = $('roster').children[i];
    if (a.alive && simT - a.inBlood < .1) spark(a.x + rand(-a.r, a.r), a.g.position.y + rand(0, a.height), a.z + rand(-a.r, a.r), 0, rand(1, 2.5), 0, .5, 1, .1, .15, -.05);
    if (row) { row.classList.toggle('dead', !a.alive); row.lastElementChild.firstElementChild.style.transform = `scaleX(${clamp(sp / a.w0, 0, 1)})`; }
    const tag = $('tags').children[i];
    if (tag) {
      proj.set(a.x, a.g.position.y + a.height + (a.isPlayer ? 1.75 : .5), a.z).project(camera);
      const show = a.alive && proj.z < 1 && !(a.isPlayer && view === 'fp' && fighting);
      tag.style.display = show ? '' : 'none';
      if (show) tag.style.transform = `translate(-50%, -100%) translate(${(proj.x + 1) / 2 * innerWidth}px, ${(1 - proj.y) / 2 * innerHeight}px)`;
    }
  });
  marker.ring.visible = player.alive;
  marker.cone.visible = player.alive && !(view === 'fp' && fighting);
  marker.ring.position.set(player.x, floorY(player.x, player.z) + .16, player.z);
  marker.ring.scale.setScalar(player.r * (1.45 + Math.sin(realT * 6) * .08));
  marker.cone.position.set(player.x, player.g.position.y + player.height + 1 + Math.sin(realT * 5) * .15, player.z);
  marker.cone.rotation.y = realT * 3;
  if (!level.track) {                    // the stage itself shrinks, turns and rocks
    const f = arenaR() / level.R;
    stage.scale.set(f, 1, f);
    const ra = level.rock ? simT * level.rock.speed : 0, sl = level.rock ? level.rock.amp / 20 : 0;
    stage.rotation.set(sl * Math.sin(ra), (level.spinFloor || 0) * simT, -sl * Math.cos(ra));
  }
  if (crowd) updateCrowd(dt); else excite = Math.max(0, excite - dt * .6);
  updateBeams();
  if (level.track) {
    for (const zn of level.track.zones || []) if (zn.type === 'wind') for (let k = 0; k < 2; k++) {   // streaks show where the wind blows
      const s = rand(zn.s0, zn.s1), c = trackSample(s).cx, hw = ts.hw, y = ts.base, dir = Math.sign(zn.value);
      spark(c - dir * hw, y + rand(.3, 1.6), -s, dir * rand(8, 12), 0, 0, .6, .7, .85, 1, 0);
    }
    sun.target.position.set(player.x, floorY(player.x, player.z), player.z);
  } else sun.target.position.set(0, 0, 0);
  sun.position.copy(sun.target.position).add(SUN_OFFSET);
  if (level.hot) for (let k = 0; k < 2; k++) {        // embers over the hot centre of the wok
    const ang = rand(0, 6.28), rr = Math.sqrt(Math.random()) * level.hot * arenaR();
    spark(Math.cos(ang) * rr, floorY(Math.cos(ang) * rr, Math.sin(ang) * rr) + .1, Math.sin(ang) * rr, rand(-.3, .3), rand(1.5, 3.5), rand(-.3, .3), rand(.5, 1), 1, .45, .1, -.05);
  }
  commentaryTick();
  const ducking = VOICE_FEATURE && voiceOn && 'speechSynthesis' in window && speechSynthesis.speaking ? .45 : 1;
  if (bedGain) bedGain.gain.setTargetAtTime((fighting ? .5 + excite * .3 : state === 'shop' ? .3 : .35) * ducking, ac.currentTime, .3);
  if (bloodBand) bloodBand.material.opacity = .3 + .18 * Math.sin(realT * 3);
  if (edgeGlow && !level.wall) edgeGlow.material.color.setScalar(.6 + Math.sin(realT * 5) * .4).multiply(EDGE_RED);
  skillWorldVisuals(dt);
  envTick(dt);
  updateSparks(dt);
  for (let i = rings.length - 1; i >= 0; i--) {
    const m = rings[i]; m.life += dt; m.scale.setScalar(1 + m.life * 22); m.material.opacity = .9 * (1 - m.life / .45);
    if (m.life > .45) { scene.remove(m); m.geometry.dispose(); rings.splice(i, 1); }
  }
  hitLight.intensity *= Math.exp(-dt * 14);
  shake = Math.max(0, shake - dt * 2.4);

  // launch arrow
  const aimLen = Math.hypot(aimVec().x, aimVec().z);
  aimArrow.visible = state === 'shop' && aimLen > .3;
  aimKnob.visible = aimArrow.visible;
  if (aimKnob.visible) aimKnob.position.set(player.x + aimVec().x, aimY(), player.z + aimVec().z);
  if (aimArrow.visible) {
    aimArrow.position.set(player.x, floorY(player.x, player.z) + player.height + .3, player.z);
    aimArrow.setDirection(new THREE.Vector3(aimVec().x / aimLen, 0, aimVec().z / aimLen));
    aimArrow.setLength(aimLen, .7, .45);
  }

  // camera
  const R = level.R, wide = innerWidth > 760;
  let k = 1 - Math.exp(-dt * 5), fov = 55, roll = 0;
  if (level.track) { k = trackCamera(dt, wide); if (view === 'fp' && fighting && player.alive) fov = 80; }
  else if (state === 'shop') {
    wantPos.set(wide ? R * .42 : 0, R * 2.15, R * .95 + (wide ? 0 : R * .7));
    wantLook.set(wide ? R * .42 : 0, 0, wide ? .3 : R * .7);
  } else if (view === 'fp' && player.alive) {
    const foe = nearest(player);
    const want = foe ? Math.atan2(foe.z - player.z, foe.x - player.x) : player.head;
    fpAim += Math.atan2(Math.sin(want - fpAim), Math.cos(want - fpAim)) * (1 - Math.exp(-dt * 5));
    const y = floorY(player.x, player.z) + player.height;
    wantPos.set(player.x - Math.cos(fpAim) * player.r * 2.2, y + .9, player.z - Math.sin(fpAim) * player.r * 2.2);
    wantLook.set(player.x + Math.cos(fpAim) * 5, y - .4, player.z + Math.sin(fpAim) * 5);
    k = 1 - Math.exp(-dt * 14); fov = 80;
    roll = Math.sin(player.phase) * player.tiltAmp * .6;
  } else {
    orbit += dt * .12;
    const cx = player.alive ? player.x * .35 : 0, cz = player.alive ? player.z * .35 : 0;
    wantPos.set(cx + Math.sin(orbit) * (R * 1.45 + 1), R + bowlDepth + 1.5, cz + Math.cos(orbit) * (R * 1.45 + 1));
    wantLook.set(cx, 0, cz);
  }
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
  camera.position.set(camPos.x + rand(-1, 1) * shake * .4, camPos.y + rand(-1, 1) * shake * .4, camPos.z + rand(-1, 1) * shake * .4);
  camera.lookAt(camLook);
  if (roll) camera.rotateZ(roll);
  if (Math.abs(camera.fov - fov) > .1) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 6); camera.updateProjectionMatrix(); }

  // HUD
  if (fighting) {
    const p = player, lvReady = p.alive && p.stormT <= 0 ? Math.min(p.stormMax, Math.floor(p.energy)) : 0;
    const clash = state === 'battle' && p.alive && simT < clashUntil && p.energy < p.stormMax && p.stormT <= 0;
    const pips = '●'.repeat(lvReady) + '○'.repeat(p.stormMax - lvReady);
    $('stormFill').style.transform = `scaleX(${p.stormT > 0 ? p.stormT / p.stormDur : p.energy >= p.stormMax ? 1 : p.energy % 1})`;
    $('btnStorm').classList.toggle('ready', lvReady > 0 && !clash);
    $('btnStorm').classList.toggle('clash', clash);
    $('stormLabel').textContent = p.stormT > 0 ? pips
      : clash ? `${t('ĐẬP SPACE! +NĂNG LƯỢNG', 'MASH SPACE! +ENERGY')} ${pips}`
      : lvReady ? `SPACE — ${t('LỐC XOÁY', 'TORNADO')} V${lvReady}! ${pips}`
      : `${t('Đang tích năng lượng…', 'Charging…')} ${pips}`;
    if (!level.track && p.skill && p.skill !== 'storm') {      // a boss skill costs one full bar
      const S = SKILLS[p.skill], ready = p.alive && p.energy >= 1 && p.skillT <= 0;
      $('stormFill').style.transform = `scaleX(${p.skillT > 0 ? p.skillT / p.skillDur : Math.min(1, p.energy)})`;
      $('btnStorm').classList.toggle('ready', ready && !clash);
      $('stormLabel').textContent = p.skillT > 0 ? S.name : clash ? t('ĐẬP SPACE! +NĂNG LƯỢNG', 'MASH SPACE! +ENERGY')
        : ready ? `SPACE — ${S.name}!` : t('Đang tích năng lượng…', 'Charging…');
    }
    if (level.track) {                     // on a course the bar buys jumps instead of tornadoes
      const canJump = p.alive && p.energy >= JUMP_COST;
      $('stormFill').style.transform = `scaleX(${Math.min(1, p.energy)})`;
      $('btnStorm').classList.toggle('ready', canJump && !clash);
      $('stormLabel').textContent = clash ? t('ĐẬP SPACE! +NĂNG LƯỢNG', 'MASH SPACE! +ENERGY') : canJump ? t('SPACE — NHẢY!', 'SPACE — JUMP!') : t('Đang tích năng lượng…', 'Charging…');
      $('title').textContent = `${stageLabel()} — ${clamp(-p.z, 0, level.track.len).toFixed(0)} / ${level.track.len} m`;
    }
    $('btnView').textContent = view === 'tv' ? t('V · Góc nhìn con quay', 'V · Top-cam') : t('V · Góc nhìn toàn cảnh', 'V · Arena view');
    if (hum) { hum.frequency.value = 30 + Math.abs(player.w) * 1.3; humGain.gain.value = player.alive && state === 'battle' ? .035 : 0; }
  }
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'battle' || state === 'ending') {
    slowT = Math.max(0, slowT - dt);
    acc += dt * (slowT > 0 ? .15 : 1);
    while (acc >= H) { stepPhysics(); acc -= H; }
    checkEnd(dt);
  }
  visuals(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// open with ?debug to drive the simulation from the console
if (params.has('debug')) window.game = {
  build, launch, setLevel, storm: () => castStorm(player), skill: () => castSkill(player), story: () => [storyOpen(), $('storyText').textContent], press: powerPress, toggleView, levels: LEVELS,
  boost: lv => { player.stormMax = lv; player.energy = lv; },
  audio: () => {      // RMS of the final mix, for checking levels without ears
    const rms = m => { if (!m) return null; const a = new Float32Array(m.fftSize); m.getFloatTimeDomainData(a); return +Math.sqrt(a.reduce((s, x) => s + x * x, 0) / a.length).toFixed(4); };
    return { state: ac && ac.state, soundOn, musicOn, voiceOn, voice: voice && voice.name, crowd: Object.keys(crowdBufs), crowdLevel: rms(crowdMeter), mix: rms(mixMeter) };
  },
  sfx, setExcite: v => { excite = v; },
  nodes: () => ({ ac, master, crowdBus, bedGain, musicGain, mixMeter, crowdMeter }),
  solo: on => { if (musicGain) musicGain.gain.value = on ? 0 : musicOn ? MUSIC_VOL : 0; if (humGain) humGain.gain.value = 0; },
  tick: n => { for (let i = 0; i < n && (state === 'battle' || state === 'ending'); i++) { stepPhysics(); checkEnd(H); } visuals(1 / 60); },
  sim: (b, lv, runs = 3, auto = true) => {
    Object.assign(build, b); headless = true; let wins = 0, time = 0, hits = 0;
    for (let k = 0; k < runs; k++) {
      setLevel(lv); launch();
      while (state === 'battle' || state === 'ending') {
        stepPhysics(); checkEnd(H);
        if (auto && level.track) { if (player.yOff <= 0 && inHole(-(player.z + player.vz * .08))) jump(); }
        else if (auto && player.energy >= 1) { const f = nearest(player); if (f && Math.hypot(f.x - player.x, f.z - player.z) < 4) castSkill(player); }
      }
      wins += won; time += simT; hits += stats.hits;
    }
    headless = false;
    return [wins, Math.round(time / runs), Math.round(hits / runs)];
  },
  unlockAll: () => { unlocked = ARENAS - 1; unlockedT = LEVELS.length - ARENAS - 1; refreshShop(); },
  info: () => ({ state, level: levelIndex, t: +simT.toFixed(1), won, hits: stats.hits, maxHit: +stats.maxHit.toFixed(1),
    tops: tops.map(a => ({ n: a.name, alive: a.alive, why: a.why, w: Math.round(a.w), e: +a.energy.toFixed(2), max: a.stormMax, kos: a.kos, skill: a.skill, act: a.skillT > 0 ? a.active : null,
      x: +a.x.toFixed(1), z: +a.z.toFixed(1) })) }),
};

resize();
setLevel(Math.min(unlocked, ARENAS - 1));
requestAnimationFrame(frame);
</script>
</body>
