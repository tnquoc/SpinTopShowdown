<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Đại Chiến Con Quay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a2b; color: #f3efe6;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; font-weight: 800; }
  #title { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 18px;
    text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  #roster { position: absolute; top: 12px; left: 12px; width: 190px; display: grid; gap: 6px; font-size: 13px; }
  #roster .row { background: rgba(0,0,0,.45); border-radius: 8px; padding: 5px 8px; }
  #roster .row.dead { opacity: .45; text-decoration: line-through; }
  #roster i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #roster .bar { height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  #roster .bar div { height: 100%; width: 100%; transform-origin: left; }
  .tag { position: absolute; left: 0; top: 0; padding: 2px 9px; border-radius: 999px; border: 2px solid; white-space: nowrap;
    background: rgba(12,10,22,.72); font-size: 12px; will-change: transform; }
  .tag.me { background: #ffd23f; color: #3a2a00; border-color: #fff !important; font-size: 13px; }
  #announce { position: absolute; top: 20%; left: 0; right: 0; text-align: center;
    font-size: clamp(24px, 5vw, 46px); font-weight: 900; color: #ffd23f; opacity: 0;
    text-shadow: 0 4px 0 #b3261e; }
  #announce.go { animation: announce 1.4s ease-out; }
  @keyframes announce { 0% { opacity: 0; transform: scale(.5); } 12% { opacity: 1; transform: scale(1.1); }
    75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  #btnStorm, #btnView { pointer-events: auto; position: absolute; border: 0; color: #fff; font-weight: 900; }
  #btnStorm { bottom: 18px; left: 50%; transform: translateX(-50%); width: 300px; height: 46px;
    border-radius: 999px; background: rgba(0,0,0,.5); overflow: hidden; font-size: 15px; }
  #stormFill { position: absolute; inset: 0; background: linear-gradient(90deg, #29b6f6, #7c4dff); transform-origin: left; }
  #btnStorm span { position: relative; }
  #btnStorm.ready { animation: pulse .6s infinite alternate; }
  #btnStorm.clash { background: #ff7043; animation: pulse .15s infinite alternate; }
  #btnStorm.clash #stormFill { background: linear-gradient(90deg, #ffd23f, #ff7043); }
  @keyframes pulse { to { box-shadow: 0 0 0 6px rgba(124,77,255,.45); } }
  #btnView { bottom: 18px; right: 16px; padding: 12px 16px; border-radius: 12px; background: rgba(0,0,0,.5); font-size: 14px; }

  #caster { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); max-width: min(640px, 90vw); box-sizing: border-box;
    background: rgba(12,10,22,.8); border-left: 4px solid #ffd23f; border-radius: 10px; padding: 8px 14px; font-size: 16px;
    font-weight: 700; line-height: 1.4; opacity: 0; transition: opacity .3s; }
  #caster.on { opacity: 1; }
  #caster b { color: #ffd23f; margin-right: 8px; white-space: nowrap; }
  #audioSw { position: absolute; left: 12px; bottom: 16px; display: flex; gap: 6px; pointer-events: auto; }
  #audioSw button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(0,0,0,.5); font-size: 19px; }
  #audioSw button.off { opacity: .4; text-decoration: line-through; }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 30px; color: #ffe066;
    text-shadow: 0 3px 0 rgba(0,0,0,.6); white-space: nowrap; animation: pop .8s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -60px; } }
  #flash { position: fixed; inset: 0; background: #dfe9ff; opacity: 0; pointer-events: none; }

  #shop { position: fixed; top: 0; right: 0; bottom: 0; width: 330px; box-sizing: border-box; padding: 14px 16px;
    background: rgba(24,21,38,.94); overflow-y: auto; touch-action: pan-y; font-size: 14px; }
  #shop h2 { margin: 0 0 2px; font-size: 20px; }
  #shop p { margin: 4px 0; line-height: 1.4; opacity: .85; }
  #lvls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #lvls small { flex-basis: 100%; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; opacity: .7; text-transform: uppercase; }
  #lvls button { flex: 1 0 44px; padding: 6px 0; border-radius: 8px; border: 0; background: #3a3555; color: #fff; font-weight: 800; }
  #lvls button.on { background: #ffd23f; color: #3a2a00; }
  #lvls button:disabled { opacity: .35; cursor: default; }
  #langSw { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 8px; }
  #langSw button { border: 0; border-radius: 999px; padding: 4px 11px; background: #2c2842; color: #cfc8e8; font-size: 12.5px; font-weight: 700; }
  #langSw button.on { background: #f3efe6; color: #1d1a2b; }
  #viewRow { margin: 12px 0 0; }
  #viewSw { display: flex; gap: 6px; }
  #viewSw button { border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3555; color: #fff; font-weight: 800; }
  #viewSw button.on { background: #7c4dff; }
  #lvTraits { display: grid; gap: 5px; margin: 6px 0; }
  #lvTraits span { background: #3b2f1a; color: #ffd98a; border-left: 3px solid #ffd23f; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; line-height: 1.35; }
  #lvFoes { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
  #lvFoes span { background: #3a3555; border-radius: 999px; padding: 3px 9px; font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: #2c2842; color: #cfc8e8; font-weight: 800; }
  .tabs button.on { background: #7c4dff; color: #fff; }
  .sl { margin-bottom: 9px; }
  .sl div { display: flex; justify-content: space-between; font-weight: 700; }
  .sl input { width: 100%; accent-color: #ffd23f; }
  .rowb { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; font-weight: 700; }
  .rowb button { border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3555; color: #fff; font-weight: 800; }
  #stats { background: #15121f; border-radius: 10px; padding: 9px 11px; font-family: "Consolas", "Courier New", monospace;
    font-size: 13px; line-height: 1.55; }
  #stats b { color: #ffd23f; }
  .hint { font-size: 12.5px; }
  #tabAdv label { display: flex; align-items: center; gap: 6px; margin: 7px 0; font-family: "Consolas", monospace; font-weight: 700; }
  #tabAdv input { flex: 1; min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid #4a4470; background: #15121f;
    color: #fff; font: 13px "Consolas", monospace; user-select: text; -webkit-user-select: text; }
  #pips { flex-basis: 100%; display: flex; gap: 6px; }
  #pips button { flex: 1; padding: 6px 0; border-radius: 8px; border: 0; background: #3a3555; color: #fff; font-weight: 800; }
  #pips button.on { background: #ffd23f; color: #3a2a00; }
  #pips button:disabled { opacity: .35; }
  #skills { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 6px; }
  #skills button { border: 0; border-radius: 999px; padding: 5px 10px; background: #3a3555; color: #fff; font-size: 12.5px; font-weight: 700; }
  #skills button.on { background: #7c4dff; }
  #skills button:disabled { opacity: .45; }
  .warn { color: #ff8a80; }
  #story { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 24px; background: rgba(10,8,20,.4); cursor: pointer; }
  #storyBox { width: min(640px, 94vw); background: rgba(22,19,36,.97); border: 2px solid #cfc8e8; border-radius: 16px; padding: 16px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #storyWho { font-size: 14px; letter-spacing: .6px; text-transform: uppercase; }
  #storyText { margin: 6px 0 4px; font-size: 19px; line-height: 1.5; }
  #storyBox small { opacity: .55; font-size: 12px; }
  #presets { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
  #presets button { border: 0; border-radius: 999px; padding: 5px 10px; background: #3a3555; color: #fff; font-size: 12.5px; }
  #fErr { color: #ff8a80; font-size: 12.5px; min-height: 1.2em; }
  .vars { font-family: "Consolas", monospace; }
  #go { width: 100%; margin-top: 12px; padding: 14px 0; border: 0; border-radius: 14px; background: #ffd23f; color: #3a2a00;
    font-size: 20px; font-weight: 900; box-shadow: 0 5px 0 #c79a00; }
  #go:active { transform: translateY(3px); box-shadow: 0 2px 0 #c79a00; }

  #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; background: rgba(15,12,25,.6); padding: 20px; }
  #result h1 { margin: 0; font-size: clamp(40px, 9vw, 80px); text-shadow: 0 5px 0 #b3261e; }
  #result p { margin: 0; font-size: 18px; font-weight: 600; max-width: 28em; line-height: 1.5; }
  #result button { border: 0; border-radius: 14px; padding: 13px 30px; font-size: 20px; font-weight: 900;
    background: #ffd23f; color: #3a2a00; box-shadow: 0 5px 0 #c79a00; }
  #result button.alt { background: #3a3555; color: #fff; box-shadow: 0 5px 0 #24203a; }
  #result div { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 760px) {
    #shop { top: auto; left: 0; width: auto; max-height: 48vh; }
    #roster { width: 150px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="title"></div>
  <div id="roster"></div>
  <div id="tags"></div>
  <div id="announce"></div>
  <button id="btnStorm" class="hidden"><div id="stormFill"></div><span id="stormLabel"></span></button>
  <button id="btnView" class="hidden"></button>
  <div id="caster"><b>🎙 BLV</b><span id="casterText"></span></div>
  <div id="audioSw"><button id="btnSound"></button><button id="btnMusic"></button><button id="btnVoice"></button></div>
</div>
<div id="pops"></div>
<div id="flash"></div>
<aside id="shop"></aside>
<div id="story" class="hidden"><div id="storyBox"><b id="storyWho"></b><p id="storyText"></p><small id="storyHint"></small></div></div>
<div id="result" class="hidden"><h1 id="rTitle"></h1><p id="rText"></p><div><button id="rNext"></button><button id="rRetry" class="alt"></button></div></div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
let savedLang = null;
try { savedLang = localStorage.getItem('tops.lang'); } catch (e) {}
const VI = (params.get('lang') || savedLang || navigator.language || 'en').startsWith('vi');
document.documentElement.lang = VI ? 'vi' : 'en';
const t = (vi, en) => VI ? vi : en;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sgn = v => v < 0 ? -1 : 1;
document.title = t('Đại Chiến Con Quay', 'Spin Top Showdown');

// ---------- tuning ----------
const H = 1 / 120;            // physics step
const E_LAUNCH = 1900;        // rip-cord energy: E = ½·I·ω², shared by every build
const DRIVE = 14;             // how hard a fully flat tip pushes the top along the floor
const SPIN_DECAY = 1.5;       // base spin loss, scaled by tip and 1/r
const W_MIN = 8;              // below this spin (rad/s) a top falls over
const RESTITUTION = 0.85, BURST = 0.045, MU = 0.09, HIT_LOSS = 0.035;
const CHARGE_SECONDS = 6, STORM_TIME = 2.6, STORM_RANGE = 5;
const TIME_LIMIT = 75, SUDDEN_DEATH = 15;

const FOES = {
  thunder: { name: t('Lôi Thần Tập Sự', 'Rookie Thunder God'), m: 2, r: .7, grip: .5, w: 85, color: 0x29b6f6, blades: 3,
    quote: t('"Sấm sét của ta hơi yếu, nhưng vẫn là sấm sét!"', '"My thunder is weak, but it is still thunder!"') },
  lotus: { name: t('Hồng Liên Nữ Vương', 'Crimson Lotus Queen'), m: 2.4, r: .95, grip: .12, w: 115, dir: -1, color: 0xec407a, blades: 8,
    quote: t('"Ngươi quay chưa đủ đẹp để thắng ta."', '"You do not spin beautifully enough to beat me."') },
  wind: { name: t('Hắc Phong Sát Thủ', 'Black Wind Assassin'), m: 1.4, r: .6, grip: .9, w: 125, dir: -1, color: 0x00e676, blades: 3, spikes: true,
    quote: t('"Ngươi còn chưa kịp thấy ta ra đòn."', '"You never even saw me strike."') },
  tyrant: { name: t('Thiết Giáp Bạo Chúa', 'Iron Tyrant'), m: 3.6, r: .95, grip: .55, w: 70, ai: 'chase', color: 0xeceff1, blades: 4,
    quote: t('"Nặng ký mới là chân lý."', '"Weight is the only truth."') },
  dragon: { name: t('Hoả Long Cuồng Nộ', 'Raging Fire Dragon'), m: 2.4, r: .8, grip: .7, w: 100, ai: 'chase', storm: true, color: 0xff5722, blades: 5, spikes: true,
    quote: t('"Cháy lên đi, hỡi vòng quay định mệnh!"', '"Burn, O wheel of destiny!"') },
  phantom: { name: t('Ảo Ảnh Vô Hình', 'Formless Phantom'), m: 1.6, r: .65, grip: .85, w: 135, ai: 'chase', color: 0x00e5ff, blades: 6, spikes: true,
    quote: t('"Ngươi chỉ đang đánh với cái bóng của ta thôi."', '"You are only fighting my shadow."') },
  vajra: { name: t('Kim Cang Hộ Pháp', 'Vajra Guardian'), m: 5, r: 1.15, grip: .25, w: 62, color: 0xa1887f, blades: 8,
    quote: t('"Núi thì không cần né."', '"A mountain does not dodge."') },
  moon: { name: t('Huyết Nguyệt Ma Vương', 'Blood Moon Demon King'), m: 6, r: 1.5, grip: .35, w: 62, ai: 'chase', storm: true, color: 0xd32f2f, blades: 6, crown: true, bloodImmune: true,
    quote: t('"Trăng máu đã lên. Ngươi hết giờ rồi."', '"The blood moon has risen. Your time is up."') },
  ice: { name: t('Băng Tuyết Thánh Nữ', 'Snow Mountain Saint'), m: 2.2, r: .85, grip: .3, w: 120, dir: -1, ai: 'chase', color: 0x81d4fa, blades: 6,
    quote: t('"Lạnh lắm không? Lát nữa còn lạnh hơn."', '"Cold yet? It gets colder."') },
  god: { name: t('Thần Quay Bất Bại', 'The Undefeated Spin God'), m: 7, r: 1.6, grip: .4, w: 72, ai: 'chase', storm: true, stormMax: 2, color: 0xab47bc, blades: 8, crown: true,
    quote: t('"Một trăm năm nữa hãy quay lại gặp ta."', '"Come back in a hundred years."') },
};
// the ten arenas; each one is the home ground of one campaign chapter
const ARENA_DEFS = [
  { name: t('Mâm nhôm', 'The Tin Tray'), R: 6, K: 2, wall: true, theme: 'tray', base: '#c5ced4', accent: '#6d8597',
    traits: [t('Mặt nhôm chuẩn: không có gì đặc biệt', 'Plain aluminium: nothing special')],
    blurb: t('Lòng mâm hơi trũng, có gờ chắn. Khởi động với Lôi Thần Tập Sự.', 'A shallow dish with a rim. Warm up against the Rookie Thunder God.'),
    foes: [{ ...FOES.thunder, m: 2.3, w: 105 }] },
  { name: t('Tô phở', 'The Pho Bowl'), R: 5.5, K: 3, wall: true, theme: 'pho', base: '#e9dfc6', accent: '#1e4fa3', drag: .45, traction: .6,
    traits: [t('Trơn như nước lèo: ma sát sàn ×0.45, độ bám mũi ×0.6', 'Slick with broth: floor friction ×0.45, tip traction ×0.6')],
    blurb: t('Thành dốc, ai cũng trượt về giữa. Không trốn được đâu.', 'Steep sides: everyone slides to the middle. Nowhere to hide.'),
    foes: [{ ...FOES.lotus, w: 130 }, { ...FOES.thunder, m: 2.3, w: 112 }] },
  { name: t('Bàn nhậu', 'The Drinking Table'), R: 7, K: 1.6, wall: false, theme: 'table', base: '#9c6b3f', accent: '#5d3a1a', drag: 1.7, wear: 1.3,
    traits: [t('Dính bia: ma sát sàn ×1.7, hao tốc độ quay ×1.3', 'Sticky with beer: floor friction ×1.7, spin loss ×1.3')],
    blurb: t('Không có gờ. Văng khỏi mép bàn là thua.', 'No rim. Go over the edge and you are out.'),
    foes: [FOES.tyrant, FOES.wind] },
  { name: t('Chảo gang', 'The Iron Wok'), R: 7.5, K: 2.2, wall: false, theme: 'wok', base: '#2b2e33', accent: '#ff6d00', hot: .38,
    traits: [t('Tâm chảo nóng: trong vùng đỏ, nạp năng lượng ×2.5 nhưng hao tốc độ quay ×2', 'Red-hot centre: inside it energy charges ×2.5 but spin drains ×2')],
    blurb: t('Dốc mà không có gờ. Hoả Long biết gọi lốc xoáy.', 'Steep and rimless. The Fire Dragon can summon tornadoes.'),
    foes: [FOES.dragon, FOES.tyrant, FOES.lotus] },
  { name: t('Sân đình', 'The Village Yard'), R: 8, K: 1, wall: true, theme: 'yard', base: '#b9a999', accent: '#a3261c', bumps: 1,
    traits: [t('Đá lát gồ ghề: con quay bị nảy ngẫu nhiên, càng nhẹ nảy càng mạnh', 'Bumpy paving: tops get jolted at random, lighter ones harder')],
    blurb: t('Trùm giữa: Huyết Nguyệt Ma Vương. To, nặng, và rất dai.', 'Mid-boss: the Blood Moon Demon King. Big, heavy and stubborn.'),
    foes: [FOES.moon, { ...FOES.thunder, w: 90 }, FOES.wind] },
  { name: t('Mâm xoay', 'The Lazy Susan'), R: 6.5, K: 1.6, wall: true, theme: 'table', base: '#b07a45', accent: '#5d3a1a', spinFloor: .9,
    blurb: t('Mâm xoay nhà hàng: cả sàn quay tròn và kéo mọi thứ quay theo.', 'A restaurant lazy Susan: the whole floor turns and drags everything with it.'),
    traits: [t('Sàn quay 0,9 rad/s ngược chiều kim đồng hồ: con quay bị cuốn theo rồi văng ra ngoài', 'The floor turns counter-clockwise at 0.9 rad/s: tops are carried round and flung outward')],
    foes: [FOES.phantom, FOES.tyrant, FOES.dragon] },
  { name: t('Mâm ngũ quả', 'The Five-Fruit Tray'), R: 7, K: 1.2, wall: true, theme: 'tray', base: '#c9b27a', accent: '#b71c1c',
    bumpers: [0xa5d6a7, 0x8d6e63, 0xffa726, 0xffee58, 0x8e24aa].map((color, i) => ({ x: Math.cos(i * 1.2566 + .6) * 3.6, z: Math.sin(i * 1.2566 + .6) * 3.6, r: .75, color })),
    blurb: t('Cầu, dừa, đủ, xoài, sung. Đụng vào quả nào là bị hất văng.', 'Custard apple, coconut, papaya, mango, fig. Touch one and you get flung.'),
    traits: [t('Năm quả là năm cục nảy: bật ra nhanh hơn lúc lao vào, và cho thêm chút năng lượng', 'The five fruits are bumpers: you leave faster than you arrived, with a little extra energy')],
    foes: [FOES.dragon, FOES.phantom, FOES.vajra] },
  { name: t('Thuyền thúng', 'The Basket Boat'), R: 6.5, K: 1.4, wall: true, theme: 'table', base: '#c8a96a', accent: '#6d4c41', rock: { amp: 3.2, speed: .8 }, drag: .7,
    blurb: t('Thuyền thúng giữa sóng: sàn nghiêng qua nghiêng lại, lại còn ướt.', 'A basket boat on the waves: the floor rocks back and forth, and it is wet.'),
    traits: [t('Sàn nghiêng xoay vòng: lực kéo 3,2 m/s² đổi hướng liên tục', 'The floor tilts in a circle: a 3.2 m/s² pull that keeps changing direction'),
      t('Ướt: ma sát sàn ×0.7', 'Wet: floor friction ×0.7')],
    foes: [FOES.dragon, FOES.phantom, { ...FOES.thunder, w: 110 }] },
  { name: t('Đỉnh nón lá', 'Top of the Conical Hat'), R: 6.5, K: -.45, wall: true, bloodRing: .72, theme: 'yard', base: '#e6d6a0', accent: '#8d6e63',
    blurb: t('Sàn lồi như nón lá úp: mọi thứ đều trượt ra mép. Không có gờ.', 'A dome like an upturned hat: everything slides to the edge. There is no rim.'),
    traits: [t('Sàn lồi: càng xa tâm càng bị đẩy ra ngoài', 'Dome: the further from the centre, the harder you are pushed outward'),
      t('Vòng máu quanh mép: chạm vào là bị hút tốc độ quay và mất ngay hiệu ứng kỹ năng đang dùng', 'Blood ring round the edge: touch it and it drains your spin and snuffs any active skill'),

function buildCampaign() {
  const out = [];
  CHAPTERS.forEach((ch, c) => {
    const base = ARENA_DEFS[c];
    for (let s = 0; s < 5; s++) {
      // difficulty climbs inside a chapter and from chapter to chapter; there are no free power-ups for the player
      const boss = s === 4, scale = (.9 + .055 * c) * (1 + .03 * s), foes = [];
      if (boss) { const f = FOES[ch.boss]; foes.push({ ...f, m: +(f.m * (1 + .06 * c)).toFixed(2), w: Math.round(f.w * (1 + .08 * c)), skill: ch.skill, crown: true }); }
      const count = boss ? (c < 3 ? 1 : 2) : [c < 2 ? 1 : 2, 2, c < 3 ? 2 : 3, 3][s];
      for (let k = 0; k < count; k++) {
        const src = CHAPTERS[Math.max(0, c - k)], f = FOES[src.boss];      // own sect first, then the sects already beaten
        foes.push({ ...f, name: `${t('Đệ tử', 'Disciple of the')} ${src.sect} ${NUMERALS[k]}`, crown: false, stormMax: 1,
          m: +(f.m * (.85 + .035 * c)).toFixed(2), r: Math.max(.5, f.r * .85), w: Math.round(f.w * scale * (boss ? .9 : 1)),
          skill: c >= 2 && s >= 1 && src.skill !== 'god' ? src.skill : null, bloodImmune: false });
      }
      out.push({ ...base, K: base.K * [1, 1.08, .94, 1.12, 1][s], chapter: c, stage: s, boss, wet: c === 1 || c === 7, blurb: ch.blurb, foes });
    }
  });
  return out;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;

}
function mesh(geo, material) {

const arenaR = () => level.shrink ? level.R * (1 - (1 - level.shrink.to) * clamp(simT / level.shrink.time, 0, 1)) : level.R;
function rockY(x, z) {            // a rocking floor is a plane tilting round in a circle
  if (!level.rock) return 0;
  const a = simT * level.rock.speed;
  return -level.rock.amp / 20 * (x * Math.cos(a) + z * Math.sin(a));
}
const floorY = (x, z) => level.track ? trackH(x, z) : bowlDepth * (x * x + z * z) / arenaR() ** 2 + rockY(x, z);

// Floor textures are drawn in polar space: x runs around the dish, y from the centre (bottom) to the rim (top).
function floorTex(L) {
  const tex = canvasTex(1024, 512, (c, w, h) => {
    const band = (v0, v1, style) => { c.fillStyle = style; c.fillRect(0, h * (1 - v1), w, h * (v1 - v0)); };

    const spokes = (n, v0, v1, px, style) => { c.fillStyle = style; for (let i = 0; i < n; i++) c.fillRect(w * i / n - px / 2, h * (1 - v1), px, h * (v1 - v0)); };

      for (let i = 0; i < 300; i++) { c.fillStyle = `rgba(0,0,0,${rand(.02, .06)})`; c.fillRect(rand(0, w), 0, 1, h); }

      for (let r = 0; r < 9; r++) spokes(8 + r * 4, .08 + r * .09, .17 + r * .09, 3, 'rgba(60,45,35,.45)');

}

const TIERS = 5, CROWD_COLORS = [0xef5350, 0x42a5f5, 0xffee58, 0x66bb6a, 0xffa726, 0xab47bc, 0xf5f5f5, 0x26c6da, 0xec407a];
let crowd = null, edgeGlow = null, stage = null, bloodBand = null, excite = 0;

function buildArena() {
  arena.traverse(o => { if (o.geometry) { o.geometry.dispose(); if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  arena.clear();
  stage = new THREE.Group(); arena.add(stage);     // the part that can turn, rock and shrink
  if (level.track) { crowd = null; edgeGlow = null; disposeEnv(); buildTrack(); return; }
  const L = level, pts = [];
  bowlDepth = L.K * 0.45;
  for (let i = 0; i <= 24; i++) pts.push(new THREE.Vector2(L.R * i / 24, bowlDepth * (i / 24) ** 2));
  if (L.wall) pts.push(new THREE.Vector2(L.R + .12, bowlDepth + .7), new THREE.Vector2(L.R + .5, bowlDepth + .7));
  pts.push(new THREE.Vector2(L.R + (L.wall ? .5 : .02), Math.min(-.7, bowlDepth - .5)));
  const dish = mesh(new THREE.LatheGeometry(pts, 96), new THREE.MeshPhongMaterial({ map: floorTex(L), side: THREE.DoubleSide,
    shininess: L.theme === 'tray' || L.theme === 'wok' ? 50 : 10, specular: 0x333333 }));
  dish.castShadow = false;
  edgeGlow = new THREE.Mesh(new THREE.TorusGeometry(L.R + (L.wall ? .3 : 0), .07, 8, 96),
    new THREE.MeshBasicMaterial({ color: L.wall ? 0x7fdfff : 0xff4d4d }));
  edgeGlow.rotation.x = Math.PI / 2; edgeGlow.position.y = bowlDepth + (L.wall ? .74 : .04);
  const ground = mesh(new THREE.CircleGeometry(80, 48), lambert(0x16131f));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -.7; ground.castShadow = false;

  // grandstand: a ring of steps, one spectator per seat
  const r0 = L.R * 1.3 + 2.6, steps = [new THREE.Vector2(r0 - .3, -.7)], seats = [];
  for (let i = 0; i < TIERS; i++) {
    const y = -.7 + (i + 1) * .8, rr = r0 + i * 1.4 + .7, n = Math.floor(2 * Math.PI * rr / .85);
    steps.push(new THREE.Vector2(r0 + i * 1.4, y), new THREE.Vector2(r0 + (i + 1) * 1.4, y));
    for (let k = 0; k < n; k++) { const a = (k + rand(-.25, .25)) / n * Math.PI * 2; seats.push([Math.cos(a) * rr, y, Math.sin(a) * rr]); }
  }
  steps.push(new THREE.Vector2(r0 + TIERS * 1.4, -.7));
  const stands = mesh(new THREE.LatheGeometry(steps, 64), new THREE.MeshLambertMaterial({ color: 0x2c2745, side: THREE.DoubleSide }));
  stands.castShadow = false;
  const n = seats.length;
  const body = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.22, .45, 3, 8), new THREE.MeshLambertMaterial(), n);
  const head = new THREE.InstancedMesh(new THREE.SphereGeometry(.17, 8, 6), lambert(0xf2c79b), n);
  const col = new THREE.Color();
  for (let i = 0; i < n; i++) body.setColorAt(i, col.setHex(pick(CROWD_COLORS)));
  body.frustumCulled = head.frustumCulled = false;
  crowd = { n, seats, body, head, phase: seats.map(() => rand(0, 6.28)), speed: seats.map(() => rand(6, 10)) };
  stage.add(dish, edgeGlow);
  bloodBand = null;
  if (L.bloodRing) {
    const band = [];
    for (let i = 0; i <= 12; i++) { const rho = L.R * (L.bloodRing + (1 - L.bloodRing) * i / 12); band.push(new THREE.Vector2(rho, bowlDepth * (rho / L.R) ** 2 + .04)); }
    bloodBand = new THREE.Mesh(new THREE.LatheGeometry(band, 96), new THREE.MeshBasicMaterial({ color: 0xff1744, transparent: true, opacity: .4,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
    stage.add(bloodBand);

  for (const b of L.bumpers || []) {
    const m = mesh(new THREE.SphereGeometry(b.r, 20, 14), new THREE.MeshPhongMaterial({ color: b.color, shininess: 70 }));
    m.position.set(b.x, bowlDepth * (b.x * b.x + b.z * b.z) / (L.R * L.R) + b.r * .8, b.z); stage.add(m);
  }

const dummy = new THREE.Object3D();

// sweeping stage lights
const beams = [0x7fdfff, 0xff80ab, 0xffe082, 0xb388ff].map(color => {

const AXIS_Y = new THREE.Vector3(0, 1, 0), lampV = new THREE.Vector3(), aimV = new THREE.Vector3();

// ---------- obstacle courses ----------
// A course runs towards -z; s = -z is the distance travelled. cx(s) is the centre line and the surface is a gutter:
//   height = base(s) + gut(s) · (x − cx(s))²
// so slopes, curves and banking all fall out of one height function, used for both the mesh and the physics.
const G_TRACK = 20, TRACK_DS = .25, TRACK_BACK = 3, TRACK_RUNOUT = 6, TRACK_TIME = 90;
const JUMP_COST = .5, JUMP_SPEED = 8.5;
const ZONE_COLOR = { ice: [.62, .86, 1], mud: [.42, .27, .14], boost: [1, .82, .2], wind: [.78, .9, .96] };
const ts = { cx: 0, base: 0, hw: 0, gut: 0 };   // scratch result of trackSample: read it before sampling again
let finished = false;

function compileTrack(T) {
  if (T.n) return;
  T.len = T.segs.reduce((s, g) => s + g.len, 0);
  const n = T.n = Math.ceil((T.len + TRACK_BACK + TRACK_RUNOUT) / TRACK_DS) + 2;
  T.cx = new Float32Array(n); T.base = new Float32Array(n);
  const hw = new Float32Array(n), gut = new Float32Array(n);
  let si = 0, s0 = 0, cx0 = 0, base = 0;
  for (let i = 0; i < n; i++) {
    const s = i * TRACK_DS - TRACK_BACK;
    while (si < T.segs.length - 1 && s > s0 + T.segs[si].len) { s0 += T.segs[si].len; cx0 += T.segs[si].turn || 0; si++; }
    const g = T.segs[si], u = clamp((s - s0) / g.len, 0, 1);
    T.cx[i] = cx0 + (g.turn || 0) * u * u * (3 - 2 * u);
    hw[i] = g.hw; gut[i] = g.gut; T.base[i] = base;
    if (s >= 0 && s < T.len) base -= g.slope * TRACK_DS;
  }
  // blend width and gutter depth across segment joints so there are no steps in the floor
  const blur = src => Float32Array.from(src, (_, i) => {
    let sum = 0, k = 0;
    for (let j = Math.max(0, i - 6); j <= Math.min(n - 1, i + 6); j++) { sum += src[j]; k++; }
    return sum / k;
  });

}

function trackSample(s) {
  const T = level.track, u = clamp((s + TRACK_BACK) / TRACK_DS, 0, T.n - 1.001), i = Math.floor(u), f = u - i;
  ts.cx = T.cx[i] + (T.cx[i + 1] - T.cx[i]) * f; ts.base = T.base[i] + (T.base[i + 1] - T.base[i]) * f;
  ts.hw = T.hw[i] + (T.hw[i + 1] - T.hw[i]) * f; ts.gut = T.gut[i] + (T.gut[i + 1] - T.gut[i]) * f;

}

function onTrack(x, z) {
  const s = -z;
  if (s < -TRACK_BACK || s > level.track.len + TRACK_RUNOUT) return false;
  const q = trackSample(s);
  return Math.abs(x - q.cx) <= q.hw && !inHole(s);

function zoneAt(s) { for (const zn of level.track.zones || []) if (s >= zn.s0 && s <= zn.s1) return zn; return null; }

function buildTrack() {
  const L = level, T = L.track;
  compileTrack(T);
  const COLS = 10, pos = [], col = [], idx = [], base = new THREE.Color(L.base);
  for (let i = 0; i < T.n; i++) {

    let c = zn ? ZONE_COLOR[zn.type] : [base.r, base.g, base.b];
    let k = Math.floor(s / 2) % 2 ? 1 : .86;                         // cross stripes make speed readable
    if (zn && zn.type === 'boost') k = Math.floor(s) % 2 ? 1 : .55;
    if (s < 0) c = [.35, .75, .45];                                  // start pad
    for (let j = 0; j <= COLS; j++) {
      const x = q.cx + (j / COLS * 2 - 1) * q.hw;
      pos.push(x, q.base + q.gut * (x - q.cx) ** 2, -s);
      if (s > T.len) { const w = (Math.floor(s * 1.5) + j) % 2 ? .95 : .12; col.push(w, w, w); }          // chequered finish
      else if (j === 0 || j === COLS) col.push(...(Math.floor(s) % 2 ? [.9, .2, .2] : [.95, .95, .95]));  // kerbs

    if (inHole((i + .5) * TRACK_DS - TRACK_BACK)) continue;
    for (let j = 0; j < COLS; j++) { const a = i * (COLS + 1) + j, b = a + COLS + 1; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  }

  road.castShadow = false;

  const put = (m, x, y, z) => { m.position.set(x, y, z); arena.add(m); return m; };
  for (let s = 4; s < T.len; s += 9) {                               // stilts under the road
    const c = trackSample(s).cx, y = ts.base;

    put(mesh(new THREE.CylinderGeometry(b.r * 1.08, b.r * 1.08, .22, 18), lambert(0xfafafa)), b.x, trackH(b.x, b.z) + .9, b.z);

    const s = (zn.s0 + zn.s1) / 2, c = trackSample(s).cx, hw = ts.hw, side = -Math.sign(zn.value);

  const flag = canvasTex(256, 64, (c, w, h) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 4; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(i * 16, j * 16, 16, 16); } });
  put(mesh(new THREE.BoxGeometry(fw * 2 + .3, .9, .12), new THREE.MeshBasicMaterial({ map: flag })), fc, fy + 3.3, -T.len);
  const abyss = put(mesh(new THREE.CircleGeometry(120, 40), lambert(0x120f1a)), 0, T.base[T.n - 1] - 16, -T.len / 2);
  abyss.rotation.x = -Math.PI / 2; abyss.castShadow = false;
}

// per-step rules that only exist on a course: real jumps, falling off, posts, the finish line
function trackBounds(a) {
  const T = level.track;
  if (a.yOff > 0) {
    a.vy -= 30 * H; a.yOff += a.vy * H;
    if (a.yOff <= 0) {
      a.yOff = 0; a.vy = 0;
      if (!headless && onTrack(a.x, a.z)) { sfx.wall(); for (let i = 0; i < 8; i++) spark(a.x, floorY(a.x, a.z) + .2, a.z, rand(-3, 3), rand(1, 3), rand(-3, 3), .3, .9, .9, .8); }
    }
  }
  if (a.yOff <= 0 && !onTrack(a.x, a.z)) { kill(a, 'ring'); return; }
  for (const b of T.bumpers || []) {
    const dx = a.x - b.x, dz = a.z - b.z, d = Math.hypot(dx, dz), min = a.r + b.r;
    if (d >= min || d === 0) continue;
    const nx = dx / d, nz = dz / d, vn = a.vx * nx + a.vz * nz;
    a.x = b.x + nx * min; a.z = b.z + nz * min;

      a.vx -= 1.7 * vn * nx; a.vz -= 1.7 * vn * nz; a.head = Math.atan2(a.vz, a.vx); a.w *= .985;
      if (!headless && vn < -1.5) {
        for (let i = 0; i < 10; i++) spark(a.x - nx * a.r, floorY(a.x, a.z) + .5, a.z - nz * a.r, nx * rand(1, 5) + rand(-2, 2), rand(1, 4), nz * rand(1, 5) + rand(-2, 2), .3, 1, .8, .4);
        sfx.wall(); shake = Math.max(shake, .25);
      }
    }
  }
  if (a.isPlayer && -a.z >= T.len) finished = true;
}

function jump() {
  const p = player;
  if (p.yOff > 0 || p.energy < JUMP_COST) return;
  p.energy -= JUMP_COST; p.vy = JUMP_SPEED / Math.pow(p.m / 2, .25); p.yOff = .01;
  say(pickLine('jump'), 1);
  sfx.jump();
}

function trackCamera(dt, wide) {
  const p = player, y = floorY(p.x, p.z);
  if (state === 'shop') { wantPos.set(wide ? 3 : 0, 13, 10); wantLook.set(wide ? 3 : 0, -3, -12); return 1 - Math.exp(-dt * 5); }
  if (!p.alive) return 1 - Math.exp(-dt * 2);                        // hold the shot while it falls
  if (view === 'fp') {
    const want = Math.hypot(p.vx, p.vz) > 1 ? Math.atan2(p.vz, p.vx) : -Math.PI / 2;
    fpAim += Math.atan2(Math.sin(want - fpAim), Math.cos(want - fpAim)) * (1 - Math.exp(-dt * 4));
    wantPos.set(p.x - Math.cos(fpAim) * p.r * 2.4, y + p.yOff + p.height + 1, p.z - Math.sin(fpAim) * p.r * 2.4);
    wantLook.set(p.x + Math.cos(fpAim) * 6, y + p.yOff + p.height - .8, p.z + Math.sin(fpAim) * 6);
    return 1 - Math.exp(-dt * 12);
  }
  const ahead = trackSample(-p.z + 4).cx;
  wantPos.set(p.x * .5 + ahead * .5, y + 8, p.z + 9.5);

// ---------- tops ----------
const phong = (color, shininess = 60) => new THREE.MeshPhongMaterial({ color, shininess, specular: 0x8a8a8a });
const emblems = new Map();
function emblem(color, n) {
  const key = color + ':' + n;
  if (!emblems.has(key)) emblems.set(key, canvasTex(256, 256, (c, w) => {
    const m = w / 2;
    c.fillStyle = '#14141d'; c.fillRect(0, 0, w, w);
    for (let i = 0; i < n; i++) {
      const a0 = i / n * Math.PI * 2;
      c.fillStyle = hex(color);
      c.beginPath(); c.moveTo(m, m); c.arc(m, m, m, a0, a0 + Math.PI / n * 1.1); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.6)';
      c.beginPath(); c.moveTo(m, m); c.arc(m, m, m, a0, a0 + Math.PI / n * .25); c.closePath(); c.fill();
    }

    c.fillStyle = '#14141d'; c.beginPath(); c.arc(m, m, m * .4, 0, 7); c.fill();

}
const auraTex = canvasTex(128, 128, (c, w) => {
  const g = c.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.5, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');

  const paint = phong(a.color, 80), steel = phong(0xdde3ea, 140), dark = phong(0x24242f, 40);

    if (!VARS.includes(id) && !FUNCS.includes(id)) throw new Error(t('Không biết tên', 'Unknown name') + ` "${id}"`);
  const fn = new Function(...VARS, `const {${FUNCS.join(',')}} = Math; return (${src.replace(/\^/g, '**')});`);
  fn(...VARS.map(() => 1));   // surface syntax errors now rather than mid-battle
  return fn;
}

function nearest(a) {

}

      try {

          foe ? Math.abs(foe.w) : 0, d, simT, level.R,
          level.track ? trackSample(-a.z).cx : 0, level.track ? trackSample(-a.z + 3).cx : 0);
      } catch (e) { sx = sz = 0; }

      sx = (foe.x - a.x) / ed * lim * .7; sz = (foe.z - a.z) / ed * lim * .7;

}

function kill(a, why) {
  if (!a.alive || state !== 'battle') return;
  a.alive = false; a.why = why; a.stormT = 0;
  a.fallY = level.track ? floorY(a.x, a.z) + a.yOff : floorY(0, arenaR());
  if (level.track) { a.yOff = 0; a.vy = 0; }
  // whoever touched it last gets the knock-out; the player's knock-outs unlock bigger tornadoes
  const by = a.lastHitBy;
  let bonus = '';
  if (by && by.alive && simT - a.lastHitT < 5) {
    by.kos++;
    if (by.isPlayer && by.skill === 'storm' && by.stormMax < 3) {
      by.stormMax++; by.energy = Math.min(by.stormMax, by.energy + .5);
      bonus = ` ${t('Lốc xoáy lên', 'Tornado upgraded to')} V${by.stormMax}!`;
    }
  }
  announce(`${a.name} ${why === 'ring' ? t('văng khỏi sàn!', 'flew off the edge!') : t('hết pin!', 'ran out of spin!')}${bonus}`);
  commentKO(a, by && simT - a.lastHitT < 5 ? by : null);
  sfx.out(); excite = 1;
}

const STORM_COLORS = [0xbfdcff, 0xc59bff, 0xffe082];
function castStorm(a) {
  if (state !== 'battle' || !a || !a.alive || a.energy < 1 || a.stormT > 0) return;
  // the player spends every full bar at once; rivals always cast at their own level
  const lv = a.isPlayer ? Math.min(a.stormMax, Math.floor(a.energy)) : a.stormMax;
  a.energy = a.isPlayer ? a.energy - lv : 0;
  a.stormLv = lv; a.stormT = a.stormDur = STORM_TIME * (1 + .25 * (lv - 1)); excite = 1;
  sfx.wind(lv); sfx.whistle();
  const label = [t('LỐC XOÁY!', 'TORNADO!'), t('LỐC XOÁY V2!', 'TORNADO V2!'), t('SIÊU BÃO V3!', 'SUPER STORM V3!')][lv - 1];
  announce(a.isPlayer ? label : `${a.name}: ${label}`);
  commentSkill(a, 'storm', lv);
}

// Space during the half second after one of your collisions pumps extra energy; otherwise it releases the tornado
const MASH_GAIN = .04, MASH_MAX = 8, CLASH_WINDOW = .6;
let clashUntil = -1, clashN = 0, lastMash = -9999;
function powerPress() {
  if (state !== 'battle' || !player.alive) return;
  const now = performance.now();
  const spend = level.track ? jump : () => castSkill(player);
  if (simT < clashUntil && clashN < MASH_MAX && player.energy < player.stormMax) {
    clashN++; lastMash = now;
    player.energy = Math.min(player.stormMax, player.energy + MASH_GAIN);
    sfx.mash(clashN);
    if (clashN === 4) say(pickLine('mash'), 1);
    const y = floorY(player.x, player.z) + player.height;
    for (let i = 0; i < 6; i++) spark(player.x, y, player.z, rand(-3, 3), rand(3, 7), rand(-3, 3), .4, .6, .7, 1);
    $('btnStorm').animate([{ transform: 'translateX(-50%) scale(1.12)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 120 });
    return;
  }
  if (now - lastMash < 350) return;   // still mashing: do not fire the tornado by accident
  spend();
}

function stormBlast(c) {
  const lv = c.stormLv, power = 1 + .5 * (lv - 1), range = STORM_RANGE * (1 + .3 * (lv - 1));
  for (const o of tops) {
    if (o === c || !o.alive) continue;
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz) || 1;
    if (d > range) continue;
    const dv = 17 * power * (1 - d / range) / Math.sqrt(o.m / 2);
    o.vx += dx / d * dv; o.vz += dz / d * dv; o.head = Math.atan2(o.vz, o.vx);
    o.lastHitBy = c; o.lastHitT = simT;
  }
  if (headless) return;
  const y = floorY(c.x, c.z);
  for (let i = 0; i < 90 * lv; i++) {
    const a = rand(0, 6.28), s = rand(6, 16 + 5 * lv);
    spark(c.x, y + .4, c.z, Math.cos(a) * s, rand(1, 7), Math.sin(a) * s, rand(.3, .7), .7, .85, 1);
  }
  shockRing(c.x, y, c.z, STORM_COLORS[lv - 1]);
  if (lv > 1) shockRing(c.x, y + .6, c.z, 0xffffff);
  shake = Math.max(shake, 1); sfx.boom();
  $('flash').animate([{ opacity: .5 }, { opacity: 0 }], { duration: 300 });
}

function collide(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), min = a.r + b.r;
  if (d >= min || d === 0) return;
  if (level.track && (a.yOff > .5 || b.yOff > .5)) return;   // jumped clean over
  const nx = dx / d, nz = dz / d;
  if (on(a, 'ghost') || on(b, 'ghost')) return;   // phantoms pass straight through
  const heft = o => on(o, 'vajra') ? 1e4 : on(o, 'lotus') ? 5 : on(o, 'iron') || o.stormT > 0 ? 3 : 1;
  const ma = a.m * heft(a), mb = b.m * heft(b), inv = 1 / ma + 1 / mb;
  const pen = min - d;
  a.x -= nx * pen / ma / inv; a.z -= nz * pen / ma / inv;
  b.x += nx * pen / mb / inv; b.z += nz * pen / mb / inv;
  const vn = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
  const fresh = simT - (a.lastHit.get(b) ?? -1) > .1;
  if (!fresh && vn >= 0) return;
  // spinning rims kick each other apart even on a gentle touch
  const rim = Math.abs(a.w) * a.r + Math.abs(b.w) * b.r;
  const J = (Math.max(0, -vn) * (1 + RESTITUTION) + (fresh ? BURST * rim * rand(.6, 1.4) : 0)) / inv * (on(a, 'dash') || on(b, 'dash') ? 1.8 : 1);
  a.vx -= J / ma * nx; a.vz -= J / ma * nz;
  b.vx += J / mb * nx; b.vz += J / mb * nz;
  if (!fresh) return;
  a.lastHit.set(b, simT); b.lastHit.set(a, simT);
  // rim friction: same-direction spins grind and fling sideways, opposite spins mesh like gears
  const slip = a.w * a.r + b.w * b.r, Jt = MU * J * sgn(slip) * Math.min(1, Math.abs(slip) / 20);
  const tx = -nz, tz = nx;
  a.vx -= Jt / ma * tx; a.vz -= Jt / ma * tz;
  b.vx += Jt / mb * tx; b.vz += Jt / mb * tz;
  for (const [o, s] of [[a, a.w - Jt * a.r / a.I], [b, b.w - Jt * b.r / b.I]]) {
    if (!on(o, 'lotus') && !on(o, 'vajra')) {      // warded tops keep their spin
      const w = s - sgn(s) * HIT_LOSS * J / o.I;
      o.w = sgn(w) === sgn(o.w) ? w : 0;
    }
    o.head = Math.atan2(o.vz, o.vx);
    o.energy = Math.min(o.stormMax, o.energy + J * .006);
  }
  a.lastHitBy = b; b.lastHitBy = a; a.lastHitT = b.lastHitT = simT;
  // a vajra pillar throws whoever hits it back and rattles their spin
  if (on(a, 'vajra')) { b.vx += nx * 6; b.vz += nz * 6; b.w *= .92; }
  if (on(b, 'vajra')) { a.vx -= nx * 6; a.vz -= nz * 6; a.w *= .92; }
  if (a.isPlayer || b.isPlayer) { clashUntil = simT + CLASH_WINDOW; clashN = 0; }
  stats.hits++; stats.maxHit = Math.max(stats.maxHit, J);
  hitFx(a.x + nx * a.r, floorY(a.x, a.z) + Math.min(a.height, b.height) * .6, a.z + nz * a.r, J);
}

function hitFx(x, y, z, J) {
  if (headless) return;
  excite = Math.min(1, excite + J / 30);
  if (J > 14) say(pickLine('hit'), 1);
  const n = clamp(Math.round(J * 3), 8, 110);
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(3, 7 + J * .5), hot = Math.random();
    spark(x, y, z, Math.cos(a) * s, rand(2, 6 + J * .4), Math.sin(a) * s, rand(.25, .7), 1, .55 + hot * .45, hot * .6);
  }
  hitLight.color.setHex(0xffc266); hitLight.position.set(x, y + .8, z); hitLight.intensity = Math.min(45, J * 2.5);
  shake = Math.max(shake, Math.min(1, J / 22));
  if (J > 11) slowT = .09;
  if (J > 13) popup(x, y, z, pick(HIT_WORDS));
  sfx.clang(clamp(J / 14, .3, 1.4));
}

// round obstacles: plain posts on courses, springy fruit on the five-fruit tray
function hitPosts(a, posts, kick) {
  for (const b of posts) {
    const dx = a.x - b.x, dz = a.z - b.z, d = Math.hypot(dx, dz), min = a.r + b.r;
    if (d >= min || d === 0) continue;
    const nx = dx / d, nz = dz / d, vn = a.vx * nx + a.vz * nz;
    a.x = b.x + nx * min; a.z = b.z + nz * min;
    if (vn >= 0) continue;
    a.vx += (kick - 1.8 * vn) * nx; a.vz += (kick - 1.8 * vn) * nz;
    a.head = Math.atan2(a.vz, a.vx); a.w *= .985;
    if (kick) a.energy = Math.min(a.stormMax, a.energy + .03);
    if (headless || vn > -1.5) continue;
    for (let i = 0; i < 10; i++) spark(a.x - nx * a.r, floorY(a.x, a.z) + .5, a.z - nz * a.r, nx * rand(1, 5) + rand(-2, 2), rand(1, 4), nz * rand(1, 5) + rand(-2, 2), .3, 1, .8, .4);
    kick ? sfx.boing() : sfx.wall();
    shake = Math.max(shake, .25);
  }
}

// the blood ring on the hat drains spin and snuffs any active skill; its master feeds on it instead
function bloodTouch(a) {
  a.inBlood = simT;
  if (a.bloodImmune) { a.w += sgn(a.w) * 6 * H; return; }
  a.w -= sgn(a.w) * Math.min(Math.abs(a.w), 11 * H);
  if (a.skillT > 0) { a.skillT = 0; a.active = null; }
  if (a.stormT > 0) a.stormT = 0;
}

function stepPhysics() {
  simT += H;
  const L = level;
  const K = L.K + (L.K < 0 ? -1 : 1) * Math.max(0, simT - SUDDEN_DEATH) * .15;   // the floor slowly gets steeper so nobody can hide
  const Reff = arenaR(), spinW = L.spinFloor || 0;
  const traction = L.traction ?? 1, floorDrag = L.drag ?? 1, wear = L.wear ?? 1, T = L.track;
  for (const a of tops) {
    if (!a.alive) continue;
    const sp = Math.max(Math.abs(a.w), 1);
    // a top precesses: the slower it spins, the tighter the loops it walks
    a.head += sgn(a.w) * precession(sp, a.r) * H;
    let drive = DRIVE * a.grip * traction, gx = -K * a.x, gz = -K * a.z;
    a.dragK = 1; a.steerK = 1;
    let driveK = 1, decayK = 1;
    if (on(a, 'lotus')) { driveK = 0; decayK = 3; a.steerK = 0; }
    else if (on(a, 'iron')) { driveK = .5; decayK = 1.5; }
    else if (on(a, 'ghost')) driveK = 1.5;
    else if (on(a, 'vajra')) { driveK = 0; decayK = 2; a.steerK = 0; }
    if (fields.length && inField(a)) { a.dragK *= .15; a.steerK *= .2; driveK *= .3; }   // frost field: everyone slides
    if (L.rock) { const ra = simT * L.rock.speed; gx += L.rock.amp * Math.cos(ra); gz += L.rock.amp * Math.sin(ra); }
    if (T) {
      // on a course the floor does the pushing: gravity along the slope of the height field
      const e = .06, s = -a.z, zn = zoneAt(s);
      gx = -G_TRACK * (trackH(a.x + e, a.z) - trackH(a.x - e, a.z)) / (2 * e);
      gz = -G_TRACK * (trackH(a.x, a.z + e) - trackH(a.x, a.z - e)) / (2 * e);
      drive *= .35; a.dragK = .65;
      if (a.yOff > 0) { gx = gz = drive = 0; a.dragK = .1; a.steerK = 0; }
      else if (zn && zn.type === 'ice') { a.dragK = .25; a.steerK = .3; drive *= .3; }
      else if (zn && zn.type === 'mud') a.dragK = 2.6;
      else if (zn && zn.type === 'boost') {
        const c1 = trackSample(s + .5).cx, c0 = trackSample(s - .5).cx, n = Math.hypot(c1 - c0, 1);
        gx += (c1 - c0) / n * 16; gz -= 16 / n;
      }
      if (zn && zn.type === 'wind') gx += zn.value * 2 / a.m;
    }
    const [sx, sz, cost] = steer(a);
    const hot = L.hot && Math.hypot(a.x, a.z) < L.hot * Reff;
    const idle = a.ai === 'guard' && Math.abs(a.z - player.z) > 10;   // guards only tire once you get close
    a.ax = Math.cos(a.head) * drive * driveK + gx + sx;
    a.az = Math.sin(a.head) * drive * driveK + gz + sz;
    if (!idle) a.w -= sgn(a.w) * (decayRate(a.grip, a.r) * wear * decayK * (hot ? 2 : 1) + .1 * cost) * H;   // steering is paid for in spin
    a.energy = Math.min(a.stormMax, a.energy + H / CHARGE_SECONDS * (hot ? 2.5 : 1));
  }
  for (const c of tops) {
    if (!c.alive || c.stormT <= 0) continue;
    for (const o of tops) {
      if (o === c || !o.alive) continue;
      const dx = c.x - o.x, dz = c.z - o.z, d = Math.hypot(dx, dz) || 1, s = sgn(c.w);
      const f = (1 + .5 * (c.stormLv - 1)) / (1 + d * .25);
      o.ax += (dx / d * 40 - dz / d * 16 * s) * f; o.az += (dz / d * 40 + dx / d * 16 * s) * f;
      const drain = Math.min(Math.abs(o.w), 12 * f * H);
      if (d < STORM_RANGE) { o.lastHitBy = c; o.lastHitT = simT; }
      o.w -= sgn(o.w) * drain; c.w += sgn(c.w) * drain * .5;
    }
    if ((c.stormT -= H) <= 0) { c.stormT = 0; stormBlast(c); }
  }
  for (const a of tops) {
    if (!a.alive) continue;
    const anchored = a.stormT > 0;
    a.vx += a.ax * H * (anchored ? .3 : 1); a.vz += a.az * H * (anchored ? .3 : 1);
    if (L.bumps && (a.bumpT -= H) <= 0) {          // a paving stone edge throws the top
      a.bumpT = rand(.2, .55);
      const ang = rand(0, 6.28), kick = L.bumps * rand(1.2, 3.2) / Math.sqrt(a.m / 2);
      a.vx += Math.cos(ang) * kick; a.vz += Math.sin(ang) * kick; a.head += rand(-.6, .6);
      a.w *= .994; a.vy = 2 + kick * .5; a.yOff = Math.max(a.yOff, .01);
    }
    const drag = Math.exp(-((.8 + .8 * a.grip) * floorDrag * a.dragK + (anchored ? 4 : 0)) * H);
    const fvx = spinW * a.z, fvz = -spinW * a.x;      // a turning floor drags tops along with it
    a.vx = fvx + (a.vx - fvx) * drag; a.vz = fvz + (a.vz - fvz) * drag;
    if (on(a, 'vajra')) a.vx = a.vz = 0;   // planted like a pillar
    a.x += a.vx * H; a.z += a.vz * H;
    const d = Math.hypot(a.x, a.z);
    if (T) trackBounds(a);
    else if (L.wall) {
      if (d + a.r > Reff && !on(a, 'ghost')) {
        const nx = a.x / d, nz = a.z / d, vn = a.vx * nx + a.vz * nz;
        a.x = nx * (Reff - a.r); a.z = nz * (Reff - a.r);
        if (vn > 0) {
          a.vx -= 1.6 * vn * nx; a.vz -= 1.6 * vn * nz; a.head = Math.atan2(a.vz, a.vx);
          a.w *= 1 - Math.min(.04, vn * .004);
          if (vn > 2) {
            for (let i = 0; i < 6; i++) spark(a.x + nx * a.r, floorY(a.x, a.z) + .4, a.z + nz * a.r, -nx * rand(1, 5) + rand(-2, 2), rand(1, 4), -nz * rand(1, 5) + rand(-2, 2), .3, 1, .8, .4);
            sfx.wall();
          }
        }
      }
    } else if (d > Reff + a.r * .2) kill(a, 'ring');
    if (!T && L.bumpers && a.alive && !on(a, 'ghost')) hitPosts(a, L.bumpers, 7);
    if (L.bloodRing && a.alive && Math.hypot(a.x, a.z) > L.bloodRing * Reff) bloodTouch(a);
    if (a.alive && Math.abs(a.w) < W_MIN) kill(a, 'spin');
  }
  for (let i = 0; i < tops.length; i++) for (let j = i + 1; j < tops.length; j++)
    if (tops[i].alive && tops[j].alive) collide(tops[i], tops[j]);
  skillStep();
  for (const a of tops)
    if (a.alive && !a.isPlayer && a.skill && a.energy >= 1 && a.skillT <= 0 && a.stormT <= 0 && aiWantsSkill(a)) castSkill(a);
}

const GOD_ROTATION = ['storm', 'thunder', 'fire', 'moon', 'ice', 'dash'];   // the final boss knows them all
const on = (a, id) => a.skillT > 0 && a.active === id;
const skillUnlocked = k => k === 0 || unlocked >= 5 * k;                      // skill k is the reward of chapter k's boss
let fires = [], fields = [], bolts = [];

function castSkill(a) {

  const id = a.skill === 'god' ? GOD_ROTATION[a.godI++ % GOD_ROTATION.length] : a.skill;
  if (id === 'storm') return castStorm(a);
  const S = SKILLS[id];
  a.energy -= 1; a.active = id; a.skillT = a.skillDur = S.dur; excite = 1;
  if (id === 'thunder') thunderStrike(a);
  else if (id === 'dash') {
    const foe = nearest(a);
    let dx = a.vx, dz = a.vz;
    if (!a.isPlayer && foe) { dx = foe.x - a.x; dz = foe.z - a.z; }           // rivals aim; you dash where you are already heading
    else if (Math.hypot(dx, dz) < 1) { dx = Math.cos(a.head); dz = Math.sin(a.head); }
    const n = Math.hypot(dx, dz) || 1;
    a.vx += dx / n * 16; a.vz += dz / n * 16;
  } else if (id === 'ice') fields.push({ x: a.x, z: a.z, r: 4.5, until: simT + S.dur, mesh: null });
  announce(a.isPlayer ? `${S.name}!` : `${a.name}: ${S.name}!`);
  commentSkill(a, id);
  sfx.whistle();
}

function thunderStrike(a) {
  const foe = nearest(a), d = foe ? Math.hypot(foe.x - a.x, foe.z - a.z) : Infinity;
  if (foe && d < 8) {

    foe.vx += (foe.x - a.x) / n * dv; foe.vz += (foe.z - a.z) / n * dv; foe.head = Math.atan2(foe.vz, foe.vx);
    foe.lastHitBy = a; foe.lastHitT = simT;
    bolt(foe);
  }
  if (level.wet) {                            // the current runs back through a wet floor
    a.w *= .8; bolt(a);
    if (!headless) popup(a.x, floorY(a.x, a.z) + a.height, a.z, t('BỊ GIẬT NGƯỢC!', 'SHOCKED!'));
    if (a.isPlayer) say(pickLine('shock'), 2);
  }
}
// ---- thunder: a thick forked bolt from the sky, a blue flash, and the target left crackling ----

}

function aiWantsSkill(a) {
  const foe = nearest(a);
  if (!foe) return false;
  const d = Math.hypot(foe.x - a.x, foe.z - a.z), weaker = Math.abs(a.w) < Math.abs(foe.w);
  switch (a.skill === 'god' ? GOD_ROTATION[a.godI % GOD_ROTATION.length] : a.skill) {
    case 'storm': return d < 4.5;
    case 'thunder': return d < 7;
    case 'dash': return d < 6 && d > 2;
    case 'fire': case 'ice': return d < 4;
    case 'ghost': return d < 2 && weaker;
    case 'moon': return d < 4.5 && weaker;
    default: return d < 2.6;                  // lotus, iron, vajra: brace for the hit
  }

// per-step skill effects that are not just modifiers on movement
function skillStep() {
  for (const a of tops) {
    if (!a.alive || a.skillT <= 0) continue;
    if (on(a, 'fire') && simT - a.lastFire > .08) { a.lastFire = simT; fires.push({ x: a.x, z: a.z, born: simT, owner: a }); }
    if (on(a, 'moon')) for (const o of tops) {
      if (o === a || !o.alive || Math.hypot(o.x - a.x, o.z - a.z) > 4.5) continue;
      const flow = clamp((Math.abs(a.w) - Math.abs(o.w)) * .6, -16, 16) * H;   // the faster side bleeds into the slower
      a.w -= sgn(a.w) * flow; o.w += sgn(o.w) * flow;
      if (flow < 0) { o.lastHitBy = a; o.lastHitT = simT; }
    }
    if ((a.skillT -= H) <= 0) {
      a.skillT = 0;
      // a phantom that ends up outside the wall has no way back in
      if (a.active === 'ghost' && level.wall && Math.hypot(a.x, a.z) + a.r > arenaR() + .05) kill(a, 'ring');
    }
  }
  if (fires.length) {
    fires = fires.filter(f => { if (simT - f.born < 5) return true; disposeFx(f.fx); return false; });
    for (const o of tops) {
      if (!o.alive || o.yOff > .3) continue;
      for (const f of fires) {
        if (f.owner === o && simT - f.born < .7) continue;
        if (Math.hypot(o.x - f.x, o.z - f.z) > .45 + o.r * .5) continue;
        o.w -= sgn(o.w) * Math.min(Math.abs(o.w), 18 * H); o.burnT = simT;
        if (f.owner !== o) { o.lastHitBy = f.owner; o.lastHitT = simT; }
        break;
      }
    }
  }
  if (fields.length) fields = fields.filter(f => {
    if (simT < f.until) return true;
    if (f.mesh) { iceShatter(f); disposeFx(f.mesh); }
    return false;
  });
}
const inField = a => fields.some(f => Math.hypot(a.x - f.x, a.z - f.z) < f.r);

function envTick(dt) {
  if (!envG) return;
  const L = level, R = L.R, r0 = R * 1.3 + 2.6, now = realT;
  for (const o of envG.children) {
    const u = o.userData;
    if (u.flame) { const h = (1.6 + .6 * Math.sin(now * 14 + u.seed)) * (u.flame === true ? 1 : u.flame); o.scale.set(h * .55, h, 1); }
    if (u.lantern) { const a = u.a + now * .15; o.position.set(Math.cos(a) * u.r, u.h + Math.sin(now * 1.3 + u.seed) * .4, Math.sin(a) * u.r); }
    if (u.tex) { u.tex.offset.x += dt * (L.env === 'lava' ? .01 : .02); u.tex.offset.y += dt * .05; }
    if (u.moon) o.material.opacity = .75 + .25 * Math.sin(now * 1.5);
  }
  const n = k => Math.random() < k % 1 ? Math.ceil(k) : Math.floor(k);
  switch (L.env) {
    case 'storm':                                                  // lightning keeps striking beyond the stands
      if (now > envNext) {
        envNext = now + rand(1.6, 4);
        const [x, z] = ringPoint(r0 + 2, r0 + 10), g = new THREE.Group(), pts = jagged(x + rand(-3, 3), 26, z + rand(-3, 3), x, -.7, z, 16, 2);
        g.add(boltTube(pts, .18, 0xffffff, 1), boltTube(pts, .8, 0x82b1ff, .45)); g.life = 0; scene.add(g); bolts.push(g);
        if (state === 'battle') { $('flash').animate([{ opacity: .35 }, { opacity: 0 }], { duration: 220 }); sfx.rumble(); }
      }
      for (let k = 0; k < n(1.5); k++) { const [x, z] = ringPoint(R + .3, R + .6); envDot(x, bowlDepth + .8, z, rand(-1, 1), rand(0, 1), rand(-1, 1), .25, .6, .8, 1); }
      break;
    case 'steam':                                                  // steam rising off the pho
      for (let k = 0; k < n(6); k++) { const [x, z] = ringPoint(0, R * .95); envDot(x, floorY(x, z) + .3, z, rand(-.3, .3), rand(.5, 1.1), rand(-.3, .3), rand(2.5, 4), .28, .28, .3); }
      break;
    case 'wind':                                                   // gusts circling the table, with a few leaves
      for (let k = 0; k < n(7); k++) { const [x, z, a] = ringPoint(R + .8, r0 - .8); envDot(x, rand(-.3, 2.5), z, -Math.sin(a) * 9, 0, Math.cos(a) * 9, .5, .55, .6, .65); }
      for (let k = 0; k < n(.8); k++) { const [x, z, a] = ringPoint(R + 1, r0 - 1); envDot(x, rand(1, 3), z, -Math.sin(a) * 4, -.3, Math.cos(a) * 4, 2, .45, .7, .2); }
      break;
    case 'fire':
      for (let k = 0; k < n(5); k++) { const [x, z] = ringPoint(R + .7, R + 1.1); envDot(x, .3, z, rand(-.3, .3), rand(2, 4), rand(-.3, .3), rand(.6, 1.2), 1, .45, .1); }
      break;
    case 'braziers':
      for (const o of envG.children) if (o.userData.flame && Math.random() < .5) envDot(o.position.x, o.position.y + .3, o.position.z, rand(-.3, .3), rand(1.5, 3), rand(-.3, .3), rand(.8, 1.4), 1, .5, .1);
      for (let k = 0; k < n(1); k++) { const [x, z, a] = ringPoint(R + .5, r0 - 1); envDot(x, rand(0, .6), z, -Math.sin(a) * .6, .05, Math.cos(a) * .6, 3, .35, .3, .25); }
      break;
    case 'ghost':                                                  // cold wisps swirling round the lazy Susan
      for (let k = 0; k < n(4); k++) { const [x, z, a] = ringPoint(R + .6, r0 - 1); envDot(x, rand(0, 2.5), z, -Math.sin(a) * 1.6, rand(.1, .4), Math.cos(a) * 1.6, rand(2, 3), .3, .9, 1); }
      break;
    case 'incense':                                                // golden motes drifting up through the temple
      for (let k = 0; k < n(4); k++) { const [x, z] = ringPoint(R * .3, r0 - 1); envDot(x, rand(0, 1.5), z, rand(-.15, .15), rand(.3, .7), rand(-.15, .15), rand(3, 5), 1, .8, .3); }
      break;
    case 'sea':                                                    // snow over the waves
      for (let k = 0; k < n(7); k++) { const [x, z] = ringPoint(0, r0 + 4); envDot(x, rand(10, 14), z, rand(-.6, .6), rand(-2.2, -1.2), rand(-.6, .6), 7, .8, .85, .95); }
      for (let k = 0; k < n(1.5); k++) { const [x, z] = ringPoint(R + .6, r0 - .4); envDot(x, -.4, z, 0, rand(.2, .6), 0, .8, .6, .8, 1); }
      break;
    case 'bloodmoon':                                              // red mist hugging the floor, red ash falling
      for (let k = 0; k < n(2.5); k++) { const [x, z, a] = ringPoint(R + .4, r0 - .8); envDot(x, rand(-.3, .8), z, -Math.sin(a) * .5, .1, Math.cos(a) * .5, rand(2.5, 4), .9, .1, .15); }
      for (let k = 0; k < n(2); k++) { const [x, z] = ringPoint(0, r0); envDot(x, rand(8, 12), z, rand(-.4, .4), rand(-1.5, -.8), rand(-.4, .4), 7, .8, .15, .1); }
      break;
    case 'lava':                                                   // embers off the lava, and now and then a fireball
      for (let k = 0; k < n(6); k++) { const [x, z] = ringPoint(R + .6, r0 - .4); envDot(x, -.4, z, rand(-.3, .3), rand(1.5, 3.5), rand(-.3, .3), rand(.8, 1.6), 1, .4, .05); }
      if (now > envNext) {

        sfx.rumble();
      }
      break;
  }
  for (let i = 0; i < EP; i++) {
    if (epLife[i] <= 0) continue;
    const k = i * 3;
    if ((epLife[i] -= dt) <= 0) { epPos[k + 1] = -999; continue; }
    epPos[k] += epVel[k] * dt; epPos[k + 1] += epVel[k + 1] * dt; epPos[k + 2] += epVel[k + 2] * dt;

  }

}

  voice = mine.find(v => /natural|online/i.test(v.name)) || mine.find(v => /google/i.test(v.name)) || mine[0] || null;
}

// prio 0 filler, 1 normal, 2 big moment, 3 result; a bigger moment cuts off whatever is being said
function say(text, prio = 1) {
  if (headless || state === 'shop') return;
  if (realT - castLast < 2.4 && prio <= castPrio) return;
  castLast = realT; castPrio = prio; castHide = realT + 4.5;
  $('casterText').textContent = text;
  $('caster').classList.add('on');
  if (!VOICE_FEATURE || !voiceOn || !voice || !soundOn) return;
  if (prio >= 2) speechSynthesis.cancel(); else if (speechSynthesis.speaking) return;
  const u = new SpeechSynthesisUtterance(text);
  u.voice = voice; u.lang = voice.lang; u.rate = 1.12; u.pitch = 1.05; u.volume = 1;
  speechSynthesis.speak(u);
}
function hushCaster() {
  $('caster').classList.remove('on'); castPrio = 0; castLast = -99;
  for (const k in watch) delete watch[k];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function commentStart() {
  hushCaster();
  const boss = level.boss && tops[1];
  if (level.track) say(pickLine('course', { arena: level.name }), 2);
  else if (boss) say(pickLine('boss', { foe: boss.name, skill: SKILLS[boss.skill === 'god' ? 'storm' : boss.skill]?.name ?? '' }), 2);
  else say(pickLine('start', { arena: level.name, rpm: rpmOf(player) }), 2);
}
function commentKO(a, credited) {
  const how = howOf(a.why);
  if (a.isPlayer) say(pickLine('meDown', { how }), 3);
  else say(pickLine(credited && credited.isPlayer ? 'koMe' : 'koOther', { foe: a.name, how }), 2);
}
function commentSkill(a, id, lv = 1) {
  if (id === 'storm' && lv > 1) return say(pickLine('storm2'), 2);
  const name = id === 'storm' ? SKILLS.storm.name : SKILLS[id].name;
  say(pickLine(a.isPlayer ? 'skillMe' : 'skillFoe', { foe: a.name, skill: name }), 1);
}
// things worth saying that are not a single event
function commentaryTick() {
  if (realT > castHide) $('caster').classList.remove('on');
  if (realT - castLast > 3) castPrio = 0;
  if (state !== 'battle' || !player.alive) return;
  if (!watch.low && Math.abs(player.w) / player.w0 < .3) { watch.low = 1; return say(pickLine('lowSpin'), 1); }
  if (level.track) {
    const left = Math.round(level.track.len + player.z);
    if (!watch.half && left < level.track.len / 2) { watch.half = 1; return say(pickLine('progress', { m: left }), 0); }
    return;
  }
  if (level.bloodRing && simT - player.inBlood < .1 && realT - (watch.blood || -99) > 6) { watch.blood = realT; return say(pickLine('blood'), 1); }
  if (!level.wall && Math.hypot(player.x, player.z) > arenaR() * .82 && realT - (watch.edge || -99) > 6) { watch.edge = realT; return say(pickLine('edge'), 1); }
  const alive = tops.filter(a => a.alive);
  if (!watch.duel && alive.length === 2 && tops.length > 2) { watch.duel = 1; return say(pickLine('duel'), 2); }
  if (!watch.sudden && simT > SUDDEN_DEATH) { watch.sudden = 1; return say(pickLine('sudden'), 1); }
  if (realT - castLast > 7) {
    const lead = alive.sort((a, b) => Math.abs(b.w) - Math.abs(a.w))[0];
    say(pickLine('leader', { lead: lead.isPlayer ? t('Con quay vàng', 'The golden top') : lead.name, rpm: rpmOf(lead) }), 0);
  }
}

// ---------- flow ----------
function clearTops() {
  for (const a of tops) { disposeTopMesh(a); scene.remove(a.trail); a.trail.geometry.dispose(); if (a.cone) scene.remove(a.cone); for (const k of ['bubble', 'lotusG', 'ironG', 'vajraG', 'moonG']) disposeFx(a[k]); }
  tops = [];
}

function placeTops() {
  clearTops();
  player = makeTop({ name: t('Bạn', 'You'), color: 0xffd23f, m: build.m, r: build.r, grip: build.grip, dir: build.dir, blades: 4, skill: level.track ? null : build.skill }, true);
  player.x = dropPt().x; player.z = dropPt().z;
  player.vx = aimVec().x * 2; player.vz = aimVec().z * 2;
  player.head = Math.atan2(player.vz, player.vx);
  tops.push(player);
  level.foes.forEach((f, i) => {
    // once the twist is out, the final boss is no longer a stranger
    const a = makeTop(level.boss && level.chapter === 9 && i === 0 && seen.b9 ? { ...f, name: t('Cha · Thần Quay Bất Bại', 'Dad · The Undefeated Spin God') } : f, false), ang = -Math.PI / 2 + (i - (level.foes.length - 1) / 2) * 1.0, rr = level.R * .5;
    a.x = Math.cos(ang) * rr; a.z = Math.sin(ang) * rr;
    a.head = ang + Math.PI / 2; a.vx = Math.cos(a.head) * 3; a.vz = Math.sin(a.head) * 3;
    tops.push(a);
  });
  if (level.track) for (const g of level.track.guards || []) {
    const a = makeTop({ ...FOES[g.foe], ai: 'guard', storm: false }, false);
    a.x = a.homeX = trackSample(g.s).cx + g.off; a.z = a.homeZ = -g.s; a.patrol = g.patrol || 0;
    tops.push(a);
  }
  $('roster').innerHTML = tops.map(a => `<div class="row"><i style="background:${hex(a.color)}"></i>${a.name}
    <div class="bar"><div style="background:${hex(a.color)}"></div></div></div>`).join('');
  $('tags').innerHTML = tops.map(a => `<div class="tag${a.isPlayer ? ' me' : ''}" style="border-color:${hex(a.color)}">${a.isPlayer ? t('BẠN', 'YOU') : a.name}</div>`).join('');
}

function setLevel(i) {
  levelIndex = i; level = LEVELS[i];
  const lim = level.R - 1.5, d = Math.hypot(build.drop.x, build.drop.z);
  if (!level.track && d > lim) { build.drop.x *= lim / d; build.drop.z *= lim / d; }
  buildArena();
  enterShop();
}

function enterShop() {
  state = 'shop'; simT = 0;
  spLife.fill(0); spPos.fill(-999);   // no stray sparks from the last battle
  placeTops();
  $('shop').classList.remove('hidden'); $('result').classList.add('hidden');
  $('btnStorm').classList.add('hidden'); $('btnView').classList.add('hidden');
  $('title').textContent = '';
  if (humGain) humGain.gain.value = 0;
  resetSkillFx(); hushCaster();
  refreshShop();
  const c = level.chapter;
  if (c !== undefined && level.stage === 0 && !seen['i' + c] && storyOn && !headless) { markSeen('i' + c); playStory(STORY[c].intro); }
}

function launch() {
  if (state !== 'shop' || storyOpen()) return;
  if (level.boss && !seen['b' + level.chapter] && storyOn && !headless) { markSeen('b' + level.chapter); return playStory(STORY[level.chapter].boss, launch); }
  try { compileSteer(); } catch (e) { showTab('adv'); $('fErr').textContent = e.message; return; }
  if (!headless) { initAudio(); save(); }
  placeTops(); resetSkillFx();
  player.yOff = 2.5;
  state = 'battle'; simT = 0; acc = 0; slowT = 0; stats = { hits: 0, maxHit: 0 }; clashUntil = -1; finished = false;
  $('shop').classList.add('hidden');
  $('btnStorm').classList.remove('hidden'); $('btnView').classList.remove('hidden');
  $('title').textContent = stageLabel();
  sfx.drop(); excite = Math.max(excite, .7);   // the stands jump up as the top drops in
  commentStart();
}

function checkEnd(dt) {
  if (state === 'battle' && level.track) {
    if (!player.alive) { won = false; state = 'ending'; endT = 1.8; }
    else if (finished) { won = true; state = 'ending'; endT = 1.2; }
    else if (simT > TRACK_TIME) { won = false; state = 'ending'; endT = .6; }
  } else if (state === 'battle') {
    const alive = tops.filter(a => a.alive);
    if (!player.alive) { won = false; state = 'ending'; endT = 1.8; }
    else if (alive.length === 1) { won = true; state = 'ending'; endT = 1.8; }
    else if (simT > TIME_LIMIT) { won = alive.every(a => Math.abs(a.w) <= Math.abs(player.w)); state = 'ending'; endT = .6; }
  } else if (state === 'ending' && (endT -= dt) <= 0) showResult();
}

function showResult() {
  state = 'result';
  if (humGain) humGain.gain.value = 0;
  const course = !!level.track, last = levelIndex === (course ? LEVELS.length : ARENAS) - 1;
  if (headless) return;   // balance sims must not touch the player's progress
  if (won) {
    if (course) unlockedT = Math.max(unlockedT, Math.min(LEVELS.length - ARENAS - 1, levelIndex - ARENAS + 1));
    else unlocked = Math.max(unlocked, Math.min(ARENAS - 1, levelIndex + 1));
    save(); sfx.win();
  } else sfx.lose();
  $('rTitle').textContent = won ? (course ? t('VỀ ĐÍCH!', 'FINISHED!') : last ? t('VÔ ĐỊCH!', 'CHAMPION!') : t('THẮNG!', 'YOU WIN!')) : t('THUA RỒI', 'YOU LOSE');
  const why = won ? (course ? t('Con quay của bạn đã về đích.', 'Your top made it to the finish.') : '')
    : player.why === 'ring' ? (course ? t('Bạn rơi khỏi đường đua.', 'You fell off the course.') : t('Bạn văng khỏi sàn.', 'You flew off the edge.'))
    : player.why === 'spin' ? t('Con quay của bạn hết pin.', 'Your top ran out of spin.')
    : course ? t('Hết giờ.', 'Out of time.') : t('Hết giờ, đối thủ còn quay khoẻ hơn.', 'Time ran out and a rival was spinning faster.');
  const rival = !won && !course && tops.filter(a => !a.isPlayer && a.alive).sort((a, b) => Math.abs(b.w) - Math.abs(a.w))[0];
  $('rText').textContent = `${rival ? `${rival.name}: ${rival.quote} ` : ''}${why || t('Con quay cuối cùng còn trụ lại là của bạn.', 'Yours was the last top standing.')} `
    + `${t('Thời gian', 'Time')}: ${simT.toFixed(1)}s · ${t('Va chạm', 'Hits')}: ${stats.hits}`;
  say(won ? pickLine(course ? 'finish' : 'win') : pickLine('lose', { foe: rival ? rival.name : t('đối thủ', 'the rival') }), 3);
  $('rNext').textContent = course ? t('Chặng tiếp theo', 'Next course') : t('Màn tiếp theo', 'Next stage');
  $('rNext').classList.toggle('hidden', !won || last);
  $('rRetry').textContent = won ? t('Chơi lại', 'Play again') : t('Chỉnh lại con quay', 'Retune and retry');
  $('result').classList.remove('hidden');
  $('btnStorm').classList.add('hidden'); $('btnView').classList.add('hidden');
  if (won && level.boss && !seen['w' + level.chapter]) {   // the beaten master hands over their skill
    const c = level.chapter, lines = [...STORY[c].win], S = SKILLS[CHAPTERS[c].skill];
    if (S) lines.push(['narr', `${t('Bạn nhận được kỹ năng', 'You gained the skill')} ${S.name}. ${S.desc} ${t('Cảnh báo:', 'Warning:')} ${S.warn}`]);
    markSeen('w' + c); playStory(lines);
  }
}
