<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Đại Chiến Con Quay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a2b; color: #f3efe6;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; font-weight: 800; }
  #title { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 18px;
    text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  #roster { position: absolute; top: 12px; left: 12px; width: 190px; display: grid; gap: 6px; font-size: 13px; }
  #roster .row { background: rgba(0,0,0,.45); border-radius: 8px; padding: 5px 8px; }
  #roster .row.dead { opacity: .45; text-decoration: line-through; }
  #roster i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  #roster .bar { height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  #roster .bar div { height: 100%; width: 100%; transform-origin: left; }
  .tag { position: absolute; left: 0; top: 0; padding: 2px 9px; border-radius: 999px; border: 2px solid; white-space: nowrap;
    background: rgba(12,10,22,.72); font-size: 12px; will-change: transform; }
  .tag.me { background: #ffd23f; color: #3a2a00; border-color: #fff !important; font-size: 13px; }
  #announce { position: absolute; top: 20%; left: 0; right: 0; text-align: center;
    font-size: clamp(24px, 5vw, 46px); font-weight: 900; color: #ffd23f; opacity: 0;
    text-shadow: 0 4px 0 #b3261e; }
  #announce.go { animation: announce 1.4s ease-out; }
  @keyframes announce { 0% { opacity: 0; transform: scale(.5); } 12% { opacity: 1; transform: scale(1.1); }
    75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  #btnStorm, #btnView { pointer-events: auto; position: absolute; border: 0; color: #fff; font-weight: 900; }
  #btnStorm { bottom: 18px; left: 50%; transform: translateX(-50%); width: 300px; height: 46px;
    border-radius: 999px; background: rgba(0,0,0,.5); overflow: hidden; font-size: 15px; }
  #stormFill { position: absolute; inset: 0; background: linear-gradient(90deg, #29b6f6, #7c4dff); transform-origin: left; }
  #btnStorm span { position: relative; }
  #btnStorm.ready { animation: pulse .6s infinite alternate; }
  #btnStorm.clash { background: #ff7043; animation: pulse .15s infinite alternate; }
  #btnStorm.clash #stormFill { background: linear-gradient(90deg, #ffd23f, #ff7043); }
  @keyframes pulse { to { box-shadow: 0 0 0 6px rgba(124,77,255,.45); } }
  #btnView { bottom: 18px; right: 16px; padding: 12px 16px; border-radius: 12px; background: rgba(0,0,0,.5); font-size: 14px; }

  #caster { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); max-width: min(640px, 90vw); box-sizing: border-box;
    background: rgba(12,10,22,.8); border-left: 4px solid #ffd23f; border-radius: 10px; padding: 8px 14px; font-size: 16px;
    font-weight: 700; line-height: 1.4; opacity: 0; transition: opacity .3s; }
  #caster.on { opacity: 1; }
  #caster b { color: #ffd23f; margin-right: 8px; white-space: nowrap; }
  #audioSw { position: absolute; left: 12px; bottom: 16px; display: flex; gap: 6px; pointer-events: auto; }
  #audioSw button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(0,0,0,.5); font-size: 19px; }
  #audioSw button.off { opacity: .4; text-decoration: line-through; }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 30px; color: #ffe066;
    text-shadow: 0 3px 0 rgba(0,0,0,.6); white-space: nowrap; animation: pop .8s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -60px; } }
  #flash { position: fixed; inset: 0; background: #dfe9ff; opacity: 0; pointer-events: none; }

  #shop { position: fixed; top: 0; right: 0; bottom: 0; width: 330px; box-sizing: border-box; padding: 14px 16px;
    background: rgba(24,21,38,.94); overflow-y: auto; touch-action: pan-y; font-size: 14px; }
  #shop h2 { margin: 0 0 2px; font-size: 20px; }
  #shop p { margin: 4px 0; line-height: 1.4; opacity: .85; }
  #lvls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #lvls small { flex-basis: 100%; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; opacity: .7; text-transform: uppercase; }
  #lvls button { flex: 1 0 44px; padding: 6px 0; border-radius: 8px; border: 0; background: #3a3555; color: #fff; font-weight: 800; }
  #lvls button.on { background: #ffd23f; color: #3a2a00; }
  #lvls button:disabled { opacity: .35; cursor: default; }
  #langSw { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 8px; }
  #langSw button { border: 0; border-radius: 999px; padding: 4px 11px; background: #2c2842; color: #cfc8e8; font-size: 12.5px; font-weight: 700; }
  #langSw button.on { background: #f3efe6; color: #1d1a2b; }
  #viewRow { margin: 12px 0 0; }
  #viewSw { display: flex; gap: 6px; }
  #viewSw button { border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3555; color: #fff; font-weight: 800; }
  #viewSw button.on { background: #7c4dff; }
  #lvTraits { display: grid; gap: 5px; margin: 6px 0; }
  #lvTraits span { background: #3b2f1a; color: #ffd98a; border-left: 3px solid #ffd23f; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; line-height: 1.35; }
  #lvFoes { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
  #lvFoes span { background: #3a3555; border-radius: 999px; padding: 3px 9px; font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 8px 0; border: 0; border-radius: 8px; background: #2c2842; color: #cfc8e8; font-weight: 800; }
  .tabs button.on { background: #7c4dff; color: #fff; }
  .sl { margin-bottom: 9px; }
  .sl div { display: flex; justify-content: space-between; font-weight: 700; }
  .sl input { width: 100%; accent-color: #ffd23f; }
  .rowb { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; font-weight: 700; }
  .rowb button { border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3555; color: #fff; font-weight: 800; }
  #stats { background: #15121f; border-radius: 10px; padding: 9px 11px; font-family: "Consolas", "Courier New", monospace;
    font-size: 13px; line-height: 1.55; }
  #stats b { color: #ffd23f; }
  .hint { font-size: 12.5px; }
  #tabAdv label { display: flex; align-items: center; gap: 6px; margin: 7px 0; font-family: "Consolas", monospace; font-weight: 700; }
  #tabAdv input { flex: 1; min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid #4a4470; background: #15121f;
    color: #fff; font: 13px "Consolas", monospace; user-select: text; -webkit-user-select: text; }
  #pips { flex-basis: 100%; display: flex; gap: 6px; }
  #pips button { flex: 1; padding: 6px 0; border-radius: 8px; border: 0; background: #3a3555; color: #fff; font-weight: 800; }
  #pips button.on { background: #ffd23f; color: #3a2a00; }
  #pips button:disabled { opacity: .35; }
  #skills { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 6px; }
  #skills button { border: 0; border-radius: 999px; padding: 5px 10px; background: #3a3555; color: #fff; font-size: 12.5px; font-weight: 700; }
  #skills button.on { background: #7c4dff; }
  #skills button:disabled { opacity: .45; }
  .warn { color: #ff8a80; }
  /* cutscenes: letterbox bars, a vignette, a speaker tag and subtitles */
  #bars i { position: fixed; left: 0; right: 0; height: 11vh; background: #000; z-index: 19; pointer-events: none;
    transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  #bars i:first-child { top: 0; transform: translateY(-100%); }
  #bars i:last-child { bottom: 0; transform: translateY(100%); }
  body.cine #bars i { transform: none; }
  body.cine #hud, body.cine #shop { visibility: hidden; }
  #story { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px 3vh;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5)); cursor: pointer; }
  #story.reveal { background: radial-gradient(ellipse at center, transparent 22%, rgba(0,0,0,.85)); }
  #storyTitle { position: absolute; top: 17vh; left: 0; right: 0; text-align: center; font-size: clamp(30px, 6vw, 64px); font-weight: 900;
    letter-spacing: 1px; text-transform: uppercase; opacity: 0; text-shadow: 0 4px 0 rgba(0,0,0,.7), 0 0 30px currentColor; pointer-events: none; }
  #storyTitle.go { animation: announce 2.2s ease-out; }
  #storyBox { --c: #cfc8e8; width: min(860px, 100%); }
  #storyWho { display: inline-block; padding: 5px 22px 5px 14px; background: var(--c); color: #120f1c; font-size: 17px; font-weight: 900;
    letter-spacing: .8px; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
  #storyBox.in #storyWho { animation: whoIn .35s ease-out; }
  @keyframes whoIn { from { transform: translateX(-40px); opacity: 0; } }
  #storyText { margin: 6px 0 4px; padding: 12px 18px; min-height: 2.9em; background: rgba(8,6,16,.85); border-left: 4px solid var(--c);
    border-radius: 0 10px 10px 0; font-size: clamp(17px, 2.4vw, 23px); font-weight: 700; line-height: 1.45; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #storyBox small { opacity: .55; font-size: 12px; }
  #presets { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
  #presets button { border: 0; border-radius: 999px; padding: 5px 10px; background: #3a3555; color: #fff; font-size: 12.5px; }
  #fErr { color: #ff8a80; font-size: 12.5px; min-height: 1.2em; }
  .vars { font-family: "Consolas", monospace; }
  #go { width: 100%; margin-top: 12px; padding: 14px 0; border: 0; border-radius: 14px; background: #ffd23f; color: #3a2a00;
    font-size: 20px; font-weight: 900; box-shadow: 0 5px 0 #c79a00; }
  #go:active { transform: translateY(3px); box-shadow: 0 2px 0 #c79a00; }

  #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; background: rgba(15,12,25,.6); padding: 20px; }
  #result h1 { margin: 0; font-size: clamp(40px, 9vw, 80px); text-shadow: 0 5px 0 #b3261e; }
  #result p { margin: 0; font-size: 18px; font-weight: 600; max-width: 28em; line-height: 1.5; }
  #result button { border: 0; border-radius: 14px; padding: 13px 30px; font-size: 20px; font-weight: 900;
    background: #ffd23f; color: #3a2a00; box-shadow: 0 5px 0 #c79a00; }
  #result button.alt { background: #3a3555; color: #fff; box-shadow: 0 5px 0 #24203a; }
  #result div { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 760px) {
    #shop { top: auto; left: 0; width: auto; max-height: 48vh; }
    #roster { width: 150px; font-size: 12px; }
    /* the workshop panel covers the bottom of the screen on phones: the sound switches move up the right edge */
    #audioSw { left: auto; right: 10px; bottom: auto; top: 30vh; flex-direction: column; }
    #audioSw button { width: 38px; height: 38px; font-size: 17px; }
  }
  /* phones held sideways have little height: the commentary moves to the top-right corner and everything shrinks */
  @media (max-height: 500px) {
    #title { top: 6px; font-size: 14px; }
    #roster { top: 8px; left: 8px; width: 160px; gap: 4px; font-size: 11.5px; }
    #roster .row { padding: 3px 7px; }
    #caster { left: auto; right: 10px; top: 8px; transform: none; max-width: min(34vw, 320px); padding: 5px 9px;
      font-size: 12px; line-height: 1.3; border-left-width: 3px; }
    #caster b { margin-right: 5px; }
    #btnStorm { bottom: 10px; width: 240px; height: 38px; font-size: 13px; }
    #btnView { bottom: 10px; padding: 9px 12px; font-size: 12px; }
    #audioSw { bottom: 10px; }
    #audioSw button { width: 36px; height: 36px; font-size: 16px; }
    #result { gap: 8px; }
    #result h1 { font-size: clamp(34px, 13vh, 64px); }
    #result p { font-size: 14px; }
    #result button { padding: 9px 22px; font-size: 16px; }
    #storyTitle { top: 13vh; font-size: clamp(24px, 9vh, 40px); }
    #storyWho { font-size: 12.5px; padding: 3px 18px 3px 10px; }
    #storyText { padding: 7px 12px; min-height: 2.6em; font-size: 15px; }
    #storyBox small { display: none; }
  }
  /* the win/lose card says it all; the commentary would only show through it */
  body:has(#result:not(.hidden)) #caster, body:has(#result:not(.hidden)) #tags { opacity: 0; }
  /* the final boss: soul-style title cards, the equation overlay and the colour of stopped time */
  #soul { position: fixed; left: 0; right: 0; top: 40%; z-index: 21; padding: 18px 0; text-align: center; pointer-events: none; opacity: 0;
    font: 400 clamp(26px, 5vw, 58px) Georgia, 'Times New Roman', serif; letter-spacing: .22em; text-transform: uppercase;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,.78) 18%, rgba(0,0,0,.78) 82%, transparent); }
  #soul small { display: block; margin-top: 6px; font-size: .32em; letter-spacing: .3em; opacity: .8; }
  #soul.go { animation: soulIn 3.4s ease forwards; }
  #soul.felled { color: #f0dca0; text-shadow: 0 0 24px rgba(255,200,110,.55); }
  #soul.died { color: #b3201f; text-shadow: 0 0 24px rgba(160,0,0,.6); }
  #soul.boss { color: #d8ccff; text-shadow: 0 0 26px rgba(150,110,255,.8); }
  @keyframes soulIn { 0% { opacity: 0; letter-spacing: .1em; } 18% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; letter-spacing: .32em; } }
  #euler { position: fixed; left: 0; right: 0; bottom: 84px; z-index: 6; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s;
    font: italic 400 clamp(26px, 4.6vw, 54px) Georgia, 'Times New Roman', serif; color: #ffe9a8; text-shadow: 0 0 18px rgba(255,190,70,.85), 0 3px 0 rgba(0,0,0,.6); }
  #euler.on { opacity: 1; }
  #euler.final { transform: scale(1.18); color: #fff7dc; }
  #euler small { display: block; font-size: .42em; font-style: normal; opacity: .85; }
  canvas { transition: filter .25s; }
  body.timestop canvas { filter: grayscale(1) contrast(1.25) brightness(.92); }
  body.timefree canvas { filter: sepia(.4) saturate(1.5) brightness(1.06); }
  body.dread canvas { filter: saturate(.3) brightness(.62) contrast(1.2); transition: filter 1.4s; }
  body.dread::after { content: ''; position: fixed; inset: 0; z-index: 18; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(40,0,0,.75)); }
  #shardBox { margin-bottom: 10px; padding: 8px 10px; border: 1px solid #4a4470; border-radius: 10px; background: #1a1628; }
  .shard { display: inline-block; min-width: 24px; margin-left: 4px; padding: 2px 6px; border-radius: 6px; text-align: center;
    font: italic 700 16px Georgia, serif; background: #2c2842; color: #6f6a8a; }
  .shard.got { background: #3b2f1a; color: #ffe08a; box-shadow: 0 0 8px rgba(255,200,80,.6); }
  #eqTray { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
  .tile { display: inline-block; min-width: 26px; padding: 3px 6px; box-sizing: border-box; border-radius: 6px; text-align: center; cursor: grab;
    touch-action: none; font: italic 700 17px Georgia, serif; background: #3b2f1a; color: #ffe08a; box-shadow: 0 0 8px rgba(255,200,80,.5); }
  .tile.used { opacity: .25; cursor: default; box-shadow: none; }
  .tile.picked { outline: 2px solid #fff; }
  .tile.ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -50%) scale(1.3); }
  #eqBuild { display: flex; gap: 4px; margin: 4px 0 6px; }
  .slot { position: relative; width: 30px; height: 44px; box-sizing: border-box; border: 2px dashed #6f6a8a; border-radius: 6px; cursor: pointer; touch-action: none; }
  .slot.full { border-style: solid; border-color: #ffd54f; background: #2a2213; }
  .slot b { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font: italic 700 18px Georgia, serif; color: #ffe08a; pointer-events: none; }
  .slot b.up { bottom: auto; top: 2px; font-size: 13px; }
  .slot.hovUp { box-shadow: inset 0 18px 0 rgba(255,213,79,.35); }
  .slot.hovDown { box-shadow: inset 0 -18px 0 rgba(255,213,79,.35); }
  /* the timing bar inside the energy button while time is stopped */
  #qteZone, #qteMark { position: absolute; top: 0; bottom: 0; display: none; }
  #qteZone { background: rgba(255,213,79,.6); box-shadow: inset 0 0 0 2px #fff; }
  #qteMark { width: 5px; margin-left: -2px; background: #fff; box-shadow: 0 0 12px #fff; }
  body.qte #qteZone, body.qte #qteMark { display: block; }
  body.qte #btnStorm { background: rgba(0,0,0,.75); animation: pulse .12s infinite alternate; }
  body.qte #stormFill { background: linear-gradient(90deg, rgba(255,255,255,.15), rgba(255,255,255,.35)); }
</style>
</head>
<body>
<div id="hud">
  <div id="title"></div>
  <div id="roster"></div>
  <div id="tags"></div>
  <div id="announce"></div>
  <button id="btnStorm" class="hidden"><div id="stormFill"></div><div id="qteZone"></div><div id="qteMark"></div><span id="stormLabel"></span></button>
  <button id="btnView" class="hidden"></button>
  <div id="caster"><b>🎙 BLV</b><span id="casterText"></span></div>
  <div id="audioSw"><button id="btnSound"></button><button id="btnMusic"></button><button id="btnVoice"></button></div>
</div>
<div id="pops"></div>
<div id="flash"></div>
<div id="soul"></div>
<div id="euler"></div>
<aside id="shop"></aside>
<div id="bars"><i></i><i></i></div>
<div id="story" class="hidden"><div id="storyTitle"></div><div id="storyBox"><b id="storyWho"></b><p id="storyText"></p><small id="storyHint"></small></div></div>
<div id="result" class="hidden"><h1 id="rTitle"></h1><p id="rText"></p><div><button id="rNext"></button><button id="rRetry" class="alt"></button></div></div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
let savedLang = null;
try { savedLang = localStorage.getItem('tops.lang'); } catch (e) {}
const VI = (params.get('lang') || savedLang || navigator.language || 'en').startsWith('vi');
document.documentElement.lang = VI ? 'vi' : 'en';
const t = (vi, en) => VI ? vi : en;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sgn = v => v < 0 ? -1 : 1;
document.title = t('Đại Chiến Con Quay', 'Spin Top Showdown');

// ---------- tuning ----------
const H = 1 / 120;            // physics step
const E_LAUNCH = 1900;        // rip-cord energy: E = ½·I·ω², shared by every build
const DRIVE = 14;             // how hard a fully flat tip pushes the top along the floor
const SPIN_DECAY = 1.5;       // base spin loss, scaled by tip and 1/r
const W_MIN = 8;              // below this spin (rad/s) a top falls over
const RESTITUTION = 0.85, BURST = 0.045, MU = 0.09, HIT_LOSS = 0.035;
const CHARGE_SECONDS = 6, STORM_TIME = 2.6, STORM_RANGE = 5;
const TIME_LIMIT = 75, SUDDEN_DEATH = 15;

const FOES = {
  thunder: { name: t('Lôi Thần Tập Sự', 'Rookie Thunder God'), m: 2, r: .7, grip: .5, w: 85, color: 0x29b6f6, blades: 3,
    quote: t('"Sấm sét của ta hơi yếu, nhưng vẫn là sấm sét!"', '"My thunder is weak, but it is still thunder!"') },
  lotus: { name: t('Hồng Liên Nữ Vương', 'Crimson Lotus Queen'), m: 2.4, r: .95, grip: .12, w: 115, dir: -1, color: 0xec407a, blades: 8,
    quote: t('"Ngươi quay chưa đủ đẹp để thắng ta."', '"You do not spin beautifully enough to beat me."') },
  wind: { name: t('Hắc Phong Sát Thủ', 'Black Wind Assassin'), m: 1.4, r: .6, grip: .9, w: 125, dir: -1, color: 0x00e676, blades: 3, spikes: true,
    quote: t('"Ngươi còn chưa kịp thấy ta ra đòn."', '"You never even saw me strike."') },
  tyrant: { name: t('Thiết Giáp Bạo Chúa', 'Iron Tyrant'), m: 3.6, r: .95, grip: .55, w: 70, ai: 'chase', color: 0xeceff1, blades: 4,
    quote: t('"Nặng ký mới là chân lý."', '"Weight is the only truth."') },
  dragon: { name: t('Hoả Long Cuồng Nộ', 'Raging Fire Dragon'), m: 2.4, r: .8, grip: .7, w: 100, ai: 'chase', storm: true, color: 0xff5722, blades: 5, spikes: true,
    quote: t('"Cháy lên đi, hỡi vòng quay định mệnh!"', '"Burn, O wheel of destiny!"') },

const NUMERALS = VI ? ['Nhất', 'Nhị', 'Tam'] : ['I', 'II', 'III'];
function buildCampaign() {
  const out = [];
  CHAPTERS.forEach((ch, c) => {
    const base = ARENA_DEFS[c];
    for (let s = 0; s < 5; s++) {
      // difficulty climbs inside a chapter and from chapter to chapter; there are no free power-ups for the player
      const boss = s === 4, scale = (.9 + .055 * c) * (1 + .03 * s), foes = [];
      if (boss) { const f = FOES[ch.boss]; foes.push({ ...f, m: +(f.m * (1 + .06 * c)).toFixed(2), w: Math.round(f.w * (1 + .08 * c)), skill: ch.skill, crown: true, finalBoss: c === 9 }); }
      const count = boss ? (c < 3 ? 1 : 2) : [c < 2 ? 1 : 2, 2, c < 3 ? 2 : 3, 3][s];
      for (let k = 0; k < count; k++) {
        const src = CHAPTERS[Math.max(0, c - k)], f = FOES[src.boss];      // own sect first, then the sects already beaten
        foes.push({ ...f, name: `${t('Đệ tử', 'Disciple of the')} ${src.sect} ${NUMERALS[k]}`, crown: false, stormMax: 1,
          m: +(f.m * (.85 + .035 * c)).toFixed(2), r: Math.max(.5, f.r * .85), w: Math.round(f.w * scale * (boss ? .9 : 1)),
          skill: c >= 2 && s >= 1 && src.skill !== 'god' ? src.skill : null, bloodImmune: false });
      }
      out.push({ ...base, K: base.K * [1, 1.08, .94, 1.12, 1][s], chapter: c, stage: s, boss, wet: c === 1 || c === 7, blurb: ch.blurb, foes });
    }
  });
  return out;
}

function canvasTex(w, h, draw) {

}

}

function rockY(x, z) {            // a rocking floor is a plane tilting round in a circle

const floorY = (x, z) => level.track ? trackH(x, z) : bowlDepth * (x * x + z * z) / arenaR() ** 2 + rockY(x, z);

// Floor textures are drawn in polar space: x runs around the dish, y from the centre (bottom) to the rim (top).
function floorTex(L) {
  const tex = canvasTex(1024, 512, (c, w, h) => {
    const band = (v0, v1, style) => { c.fillStyle = style; c.fillRect(0, h * (1 - v1), w, h * (v1 - v0)); };
    const ringLine = (v, px, style) => { c.fillStyle = style; c.fillRect(0, h * (1 - v) - px / 2, w, px); };
    const spokes = (n, v0, v1, px, style) => { c.fillStyle = style; for (let i = 0; i < n; i++) c.fillRect(w * i / n - px / 2, h * (1 - v1), px, h * (v1 - v0)); };
    const speckle = (n, style, s = 2) => { c.fillStyle = style; for (let i = 0; i < n; i++) c.fillRect(rand(0, w), rand(0, h), rand(1, s), rand(1, s)); };
    c.fillStyle = L.base; c.fillRect(0, 0, w, h);
    if (L.theme === 'tray') {                      // brushed aluminium
      for (let v = .02; v < .9; v += .012) ringLine(v, 1, `rgba(255,255,255,${rand(.05, .3)})`);
      for (let i = 0; i < 300; i++) { c.fillStyle = `rgba(0,0,0,${rand(.02, .06)})`; c.fillRect(rand(0, w), 0, 1, h); }
      ringLine(.3, 5, 'rgba(70,90,110,.5)'); ringLine(.6, 5, 'rgba(70,90,110,.5)');
      spokes(8, .3, .6, 3, 'rgba(70,90,110,.35)');
    } else if (L.theme === 'pho') {                // porcelain with the blue wave band of a cheap noodle bowl
      band(.62, .86, '#e2d6b8'); ringLine(.62, 6, '#1e4fa3'); ringLine(.86, 8, '#1e4fa3');
      c.strokeStyle = '#1e4fa3'; c.lineWidth = 5;
      for (let i = 0; i < 24; i++) {
        const x = w * i / 24 + w / 48, y = h * (1 - .74);
        c.beginPath(); c.arc(x, y, w / 60, Math.PI, 0); c.stroke();
        c.beginPath(); c.arc(x, y + 12, w / 120, 0, 7); c.stroke();
      }
      ringLine(.2, 4, 'rgba(30,79,163,.6)'); speckle(120, 'rgba(120,90,40,.08)', 4);
    } else if (L.theme === 'table') {              // a slice of tree trunk
      for (let v = .01; v < .96; v += rand(.006, .03)) ringLine(v, rand(1, 5), `rgba(60,30,10,${rand(.08, .3)})`);
      spokes(5, .1, .9, 2, 'rgba(40,20,5,.35)'); speckle(400, 'rgba(255,220,170,.06)', 6);
    } else if (L.theme === 'wok') {                // black iron, glowing hot in the middle
      const g = c.createLinearGradient(0, h, 0, h * .35);
      g.addColorStop(0, 'rgba(255,120,0,.85)'); g.addColorStop(.5, 'rgba(255,60,0,.3)'); g.addColorStop(1, 'rgba(255,60,0,0)');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      speckle(900, 'rgba(255,255,255,.05)', 3); speckle(500, 'rgba(0,0,0,.25)', 4);
      for (let v = .1; v < .96; v += .1) ringLine(v, 2, 'rgba(0,0,0,.25)');
    } else if (L.theme === 'void') {               // black glass scattered with stars and glowing orbits
      const g = c.createLinearGradient(0, h, 0, 0); g.addColorStop(0, '#1a0b3a'); g.addColorStop(1, '#05030c'); c.fillStyle = g; c.fillRect(0, 0, w, h);
      speckle(900, 'rgba(255,255,255,.55)', 2); speckle(200, 'rgba(180,140,255,.6)', 3);
      for (let v = .15; v < .95; v += .16) ringLine(v, 2, 'rgba(160,120,255,.45)');
      spokes(12, .1, .95, 1, 'rgba(160,120,255,.18)');
    } else {                                       // paving stones with a red and gold border
      for (let v = .08; v < .9; v += .09) ringLine(v, 3, 'rgba(60,45,35,.45)');
      for (let r = 0; r < 9; r++) spokes(8 + r * 4, .08 + r * .09, .17 + r * .09, 3, 'rgba(60,45,35,.45)');
      band(.7, .76, '#a3261c'); ringLine(.7, 4, '#e0b040'); ringLine(.76, 4, '#e0b040'); speckle(500, 'rgba(0,0,0,.07)', 5);
    }
    band(0, .06, L.accent); ringLine(.075, 4, 'rgba(0,0,0,.4)');
    if (!L.wall && L.theme !== 'void') for (let i = 0; i < 40; i++) { c.fillStyle = i % 2 ? '#e53935' : '#fafafa'; c.fillRect(w * i / 40, h * (1 - .95), w / 40 + 1, h * .06); }
  });
  tex.wrapS = THREE.RepeatWrapping; tex.anisotropy = 8;
  return tex;
}

const TIERS = 5, CROWD_COLORS = [0xef5350, 0x42a5f5, 0xffee58, 0x66bb6a, 0xffa726, 0xab47bc, 0xf5f5f5, 0x26c6da, 0xec407a];
let crowd = null, edgeGlow = null, stage = null, bloodBand = null, excite = 0, crowdClock = 0;

function buildArena() {
  arena.traverse(o => { if (o.geometry) { o.geometry.dispose(); if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  arena.clear();
  stage = new THREE.Group(); arena.add(stage);     // the part that can turn, rock and shrink
  if (level.track) { crowd = null; edgeGlow = null; disposeEnv(); clearWeather(); setMood('none'); buildTrack(); return; }
  const L = level, pts = [];
  bowlDepth = L.K * 0.45;
  for (let i = 0; i <= 24; i++) pts.push(new THREE.Vector2(L.R * i / 24, bowlDepth * (i / 24) ** 2));
  if (L.wall) pts.push(new THREE.Vector2(L.R + .12, bowlDepth + .7), new THREE.Vector2(L.R + .5, bowlDepth + .7));
  pts.push(new THREE.Vector2(L.R + (L.wall ? .5 : .02), Math.min(-.7, bowlDepth - .5)));
  const dish = mesh(new THREE.LatheGeometry(pts, 96), new THREE.MeshPhongMaterial({ map: floorTex(L), side: THREE.DoubleSide,
    shininess: L.theme === 'tray' || L.theme === 'wok' ? 50 : 10, specular: 0x333333 }));
  dish.castShadow = false;
  edgeGlow = new THREE.Mesh(new THREE.TorusGeometry(L.R + (L.wall ? .3 : 0), .07, 8, 96),

  edgeGlow.rotation.x = Math.PI / 2; edgeGlow.position.y = bowlDepth + (L.wall ? .74 : .04);
  const ground = mesh(new THREE.CircleGeometry(80, 48), lambert(0x16131f));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -.7; ground.castShadow = false;

  // grandstand: a ring of steps, one spectator per seat
  const r0 = L.R * 1.3 + 2.6, steps = [new THREE.Vector2(r0 - .3, -.7)], seats = [];
  for (let i = 0; i < TIERS; i++) {
    const y = -.7 + (i + 1) * .8, rr = r0 + i * 1.4 + .7, n = Math.floor(2 * Math.PI * rr / .85);
    steps.push(new THREE.Vector2(r0 + i * 1.4, y), new THREE.Vector2(r0 + (i + 1) * 1.4, y));
    for (let k = 0; k < n; k++) { const a = (k + rand(-.25, .25)) / n * Math.PI * 2; seats.push([Math.cos(a) * rr, y, Math.sin(a) * rr]); }
  }
  steps.push(new THREE.Vector2(r0 + TIERS * 1.4, -.7));
  const stands = mesh(new THREE.LatheGeometry(steps, 64), new THREE.MeshLambertMaterial({ color: 0x2c2745, side: THREE.DoubleSide }));
  stands.castShadow = false;
  const n = seats.length;
  const body = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.22, .45, 3, 8), new THREE.MeshLambertMaterial(), n);
  const head = new THREE.InstancedMesh(new THREE.SphereGeometry(.17, 8, 6), lambert(0xf2c79b), n);
  const col = new THREE.Color();
  for (let i = 0; i < n; i++) body.setColorAt(i, col.setHex(pick(CROWD_COLORS)));
  body.frustumCulled = head.frustumCulled = false;
  crowd = { n, seats, body, head, phase: seats.map(() => rand(0, 6.28)), speed: seats.map(() => rand(6, 10)) };
  stage.add(dish, edgeGlow);
  bloodBand = null;
  if (L.bloodRing) {
    const band = [];
    for (let i = 0; i <= 12; i++) { const rho = L.R * (L.bloodRing + (1 - L.bloodRing) * i / 12); band.push(new THREE.Vector2(rho, bowlDepth * (rho / L.R) ** 2 + .04)); }
    bloodBand = new THREE.Mesh(new THREE.LatheGeometry(band, 96), new THREE.MeshBasicMaterial({ color: 0xff1744, transparent: true, opacity: .4,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
    stage.add(bloodBand);
  }
  for (const b of L.bumpers || []) {
    const m = mesh(new THREE.SphereGeometry(b.r, 20, 14), new THREE.MeshPhongMaterial({ color: b.color, shininess: 70 }));
    m.position.set(b.x, bowlDepth * (b.x * b.x + b.z * b.z) / (L.R * L.R) + b.r * .8, b.z); stage.add(m);
  }
  arena.add(stands, body, head);
  if (L.theme === 'void') { ground.geometry.dispose(); ground.material.dispose(); } else arena.add(ground);   // over the void there is no ground, only the black hole
  buildEnv();
}

// ---------- obstacle courses ----------
// A course runs towards -z; s = -z is the distance travelled. cx(s) is the centre line and the surface is a gutter:
//   height = base(s) + gut(s) · (x − cx(s))²
// so slopes, curves and banking all fall out of one height function, used for both the mesh and the physics.
const G_TRACK = 20, TRACK_DS = .25, TRACK_BACK = 3, TRACK_RUNOUT = 6, TRACK_TIME = 90;
const JUMP_COST = .5, JUMP_SPEED = 8.5;
const ZONE_COLOR = { ice: [.62, .86, 1], mud: [.42, .27, .14], boost: [1, .82, .2], wind: [.78, .9, .96] };
const ts = { cx: 0, base: 0, hw: 0, gut: 0 };   // scratch result of trackSample: read it before sampling again
let finished = false;

function compileTrack(T) {
  if (T.n) return;
  T.len = T.segs.reduce((s, g) => s + g.len, 0);
  const n = T.n = Math.ceil((T.len + TRACK_BACK + TRACK_RUNOUT) / TRACK_DS) + 2;
  T.cx = new Float32Array(n); T.base = new Float32Array(n);
  const hw = new Float32Array(n), gut = new Float32Array(n);
  let si = 0, s0 = 0, cx0 = 0, base = 0;
  for (let i = 0; i < n; i++) {
    const s = i * TRACK_DS - TRACK_BACK;
    while (si < T.segs.length - 1 && s > s0 + T.segs[si].len) { s0 += T.segs[si].len; cx0 += T.segs[si].turn || 0; si++; }
    const g = T.segs[si], u = clamp((s - s0) / g.len, 0, 1);
    T.cx[i] = cx0 + (g.turn || 0) * u * u * (3 - 2 * u);
    hw[i] = g.hw; gut[i] = g.gut; T.base[i] = base;
    if (s >= 0 && s < T.len) base -= g.slope * TRACK_DS;
  }
  // blend width and gutter depth across segment joints so there are no steps in the floor
  const blur = src => Float32Array.from(src, (_, i) => {
    let sum = 0, k = 0;
    for (let j = Math.max(0, i - 6); j <= Math.min(n - 1, i + 6); j++) { sum += src[j]; k++; }
    return sum / k;
  });
  T.hw = blur(hw); T.gut = blur(gut);
}

function trackSample(s) {
  const T = level.track, u = clamp((s + TRACK_BACK) / TRACK_DS, 0, T.n - 1.001), i = Math.floor(u), f = u - i;
  ts.cx = T.cx[i] + (T.cx[i + 1] - T.cx[i]) * f; ts.base = T.base[i] + (T.base[i + 1] - T.base[i]) * f;
  ts.hw = T.hw[i] + (T.hw[i + 1] - T.hw[i]) * f; ts.gut = T.gut[i] + (T.gut[i + 1] - T.gut[i]) * f;
  return ts;
}
function trackH(x, z) { const q = trackSample(-z); return q.base + q.gut * (x - q.cx) ** 2; }
function inHole(s) { for (const h of level.track.holes || []) if (s > h.s0 && s < h.s1) return true; return false; }
function onTrack(x, z) {
  const s = -z;
  if (s < -TRACK_BACK || s > level.track.len + TRACK_RUNOUT) return false;
  const q = trackSample(s);
  return Math.abs(x - q.cx) <= q.hw && !inHole(s);
}
function zoneAt(s) { for (const zn of level.track.zones || []) if (s >= zn.s0 && s <= zn.s1) return zn; return null; }

function buildTrack() {
  const L = level, T = L.track;
  compileTrack(T);

const GOD_ROTATION = ['storm', 'thunder', 'fire', 'moon', 'ice', 'dash'];   // the final boss knows them all

// which skill a top will use next: the final boss cycles through them all, the void god picks any at random
const skillOf = a => a.skill === 'god' ? GOD_ROTATION[a.godI % GOD_ROTATION.length] : a.skill === 'void' ? (a.nextSkill ??= pick(SKILL_ORDER)) : a.skill;

function castSkill(a) {

  const id = skillOf(a);
  if (a.skill === 'god') a.godI++;
  if (a.skill === 'void') a.nextSkill = pick(SKILL_ORDER);

function thunderStrike(a) {

// ---- thunder: a thick forked bolt from the sky, a blue flash, and the target left crackling ----

function skillWorldVisuals(dt) {
  let burning = null;
  for (const f of fires) {
    if (!f.fx) {
      f.fx = new THREE.Group(); f.seed = rand(0, 6.28);
      const glow = new THREE.Mesh(fireGlowGeo, additive(0xff6d00, .8, { map: auraTex }));
      glow.rotation.x = -Math.PI / 2; glow.position.y = .06;
      const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      f.fx.add(glow, flame); f.fx.position.set(f.x, floorY(f.x, f.z), f.z); scene.add(f.fx);
    }
    const age = simT - f.born, k = Math.max(0, Math.min(1, age * 8, (5 - age) / 1.2));
    const [glow, flame] = f.fx.children, h = (1.7 + .5 * Math.sin(realT * 18 + f.seed)) * k;
    flame.scale.set(1.1 * k + .05, h + .05, 1); flame.position.y = h * .45; flame.material.opacity = k;
    glow.material.opacity = .8 * k;

  }
  for (let k = 0; k < Math.min(20, fires.length); k++) {
    const f = fires[Math.floor(Math.random() * fires.length)];
    spark(f.x + rand(-.25, .25), floorY(f.x, f.z) + .2, f.z + rand(-.25, .25), rand(-.4, .4), rand(2, 4.5), rand(-.4, .4), rand(.3, .7), 1, rand(.35, .6), .1, -.15);

  else fireLight.intensity *= .85;
  for (const f of fields) frostTick(f, dt);
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i]; b.life += dt;

    if (b.life > .6) { disposeFx(b); bolts.splice(i, 1); }

const EP = 900;

// streaks: short lines drawn along their own velocity, for rain and gusts
const NS = 600;
const skPos = new Float32Array(NS * 6).fill(-999), skCol = new Float32Array(NS * 6);

let skNext = 0;
function streak(x, y, z, vx, vy, vz, life, len, r, g, b) {

function updateStreaks(dt) {

    const k = i * 3, o = i * 6;
    if ((skLife[i] -= dt) <= 0) { skPos[o + 1] = skPos[o + 4] = -999; continue; }
    skP[k] += skV[k] * dt; skP[k + 1] += skV[k + 1] * dt; skP[k + 2] += skV[k + 2] * dt;
    const f = Math.min(1, skLife[i] / skMax[i] * 3);

function puff(x, y, z, vx, vy, vz, life, s0, s1, color, alpha, glow = false) {

function updatePuffs(dt) {

    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

function setLevel(i) {

    wantLook.set(cx, 0, cz);
  }
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
  camera.position.set(camPos.x + rand(-1, 1) * shake * .4, camPos.y + rand(-1, 1) * shake * .4, camPos.z + rand(-1, 1) * shake * .4);
  camera.lookAt(camLook);
  if (roll) camera.rotateZ(roll);
  if (Math.abs(camera.fov - fov) > .1) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 6); camera.updateProjectionMatrix(); }

  // HUD
  if (fighting) {
    const p = player, lvReady = p.alive && p.stormT <= 0 ? Math.min(p.stormMax, Math.floor(p.energy)) : 0;
    const clash = state === 'battle' && p.alive && simT < clashUntil && p.energy < p.stormMax && p.stormT <= 0;
    const pips = '●'.repeat(lvReady) + '○'.repeat(p.stormMax - lvReady);
    $('stormFill').style.transform = `scaleX(${p.stormT > 0 ? p.stormT / p.stormDur : p.energy >= p.stormMax ? 1 : p.energy % 1})`;
    $('btnStorm').classList.toggle('ready', lvReady > 0 && !clash);
    $('btnStorm').classList.toggle('clash', clash);
    $('stormLabel').textContent = p.stormT > 0 ? pips
      : clash ? `${t('ĐẬP SPACE! +NĂNG LƯỢNG', 'MASH SPACE! +ENERGY')} ${pips}`
      : lvReady ? `SPACE — ${t('LỐC XOÁY', 'TORNADO')} V${lvReady}! ${pips}`
      : `${t('Đang tích năng lượng…', 'Charging…')} ${pips}`;
    if (!level.track && p.skill && p.skill !== 'storm') {      // a boss skill costs one full bar
      const S = SKILLS[p.skill], ready = p.alive && p.energy >= 1 && p.skillT <= 0;
      $('stormFill').style.transform = `scaleX(${p.skillT > 0 ? p.skillT / p.skillDur : Math.min(1, p.energy)})`;
      $('btnStorm').classList.toggle('ready', ready && !clash);
      $('stormLabel').textContent = p.skillT > 0 ? S.name : clash ? t('ĐẬP SPACE! +NĂNG LƯỢNG', 'MASH SPACE! +ENERGY')
        : ready ? `SPACE — ${S.name}!` : t('Đang tích năng lượng…', 'Charging…');
    }
    if (level.track) {                     // on a course the bar buys jumps instead of tornadoes
      const canJump = p.alive && p.energy >= JUMP_COST;
      $('stormFill').style.transform = `scaleX(${Math.min(1, p.energy)})`;
      $('btnStorm').classList.toggle('ready', canJump && !clash);
      $('stormLabel').textContent = clash ? t('ĐẬP SPACE! +NĂNG LƯỢNG', 'MASH SPACE! +ENERGY') : canJump ? t('SPACE — NHẢY!', 'SPACE — JUMP!') : t('Đang tích năng lượng…', 'Charging…');
      $('title').textContent = `${stageLabel()} — ${clamp(-p.z, 0, level.track.len).toFixed(0)} / ${level.track.len} m`;
    }
    const qte = tstop && tstop.qte && tstop.free === null;
    document.body.classList.toggle('qte', !!qte);
    if (qte) {
      const m = qteMark(tstop);
      $('stormFill').style.transform = `scaleX(${m})`; $('qteMark').style.left = `${m * 100}%`;
      $('qteZone').style.left = `${tstop.qte[0] * 100}%`; $('qteZone').style.width = `${(tstop.qte[1] - tstop.qte[0]) * 100}%`;
      $('stormLabel').textContent = t('SPACE — PHƯƠNG TRÌNH SỰ SỐNG!', 'SPACE — THE EQUATION OF LIFE!');
    }
    $('btnView').textContent = view === 'tv' ? t('V · Góc nhìn con quay', 'V · Top-cam') : t('V · Góc nhìn toàn cảnh', 'V · Arena view');
    if (hum) { hum.frequency.value = 30 + Math.abs(player.w) * 1.3; humGain.gain.value = player.alive && state === 'battle' && !tstop ? .035 : 0; }
  }
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'battle' || state === 'ending') {
    slowT = Math.max(0, slowT - dt);
    acc += dt * (slowT > 0 ? .15 : 1);
    while (acc >= H) { stepPhysics(); acc -= H; }
    checkEnd(dt);
  }
  visuals(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// open with ?debug to drive the simulation from the console
if (params.has('debug')) window.game = {
  build, launch, setLevel, storm: () => castStorm(player), skill: () => castSkill(player), story: () => [storyOpen(), $('storyText').textContent], cine: () => cine && { kind: cine.kind, who: cine.who && cine.who.name, fov: cine.fov }, nextLine, endStory, restage, press: powerPress, toggleView, levels: LEVELS,
  boost: lv => { player.stormMax = lv; player.energy = lv; },
  audio: () => {      // RMS of the final mix, for checking levels without ears
    const rms = m => { if (!m) return null; const a = new Float32Array(m.fftSize); m.getFloatTimeDomainData(a); return +Math.sqrt(a.reduce((s, x) => s + x * x, 0) / a.length).toFixed(4); };
    return { state: ac && ac.state, soundOn, musicOn, voiceOn, voice: voice && voice.name, crowd: Object.keys(crowdBufs), crowdLevel: rms(crowdMeter), mix: rms(mixMeter) };
  },
  sfx, setExcite: v => { excite = v; },
  nodes: () => ({ ac, master, crowdBus, bedGain, musicGain, mixMeter, crowdMeter }),
  solo: on => { if (musicGain) musicGain.gain.value = on ? 0 : musicOn ? MUSIC_VOL : 0; if (humGain) humGain.gain.value = 0; },
  tick: n => { for (let i = 0; i < n && (state === 'battle' || state === 'ending'); i++) { stepPhysics(); checkEnd(H); } visuals(1 / 60); },
  sim: (b, lv, runs = 3, auto = true) => {
    Object.assign(build, b); headless = true; let wins = 0, time = 0, hits = 0;
    for (let k = 0; k < runs; k++) {
      setLevel(lv); launch();
      while (state === 'battle' || state === 'ending') {
        stepPhysics(); checkEnd(H);
        if (auto && level.track) { if (player.yOff <= 0 && inHole(-(player.z + player.vz * .08))) jump(); }
        else if (auto && player.energy >= 1) { const f = nearest(player); if (f && Math.hypot(f.x - player.x, f.z - player.z) < 4) castSkill(player); }
      }
      wins += won; time += simT; hits += stats.hits;
    }
    headless = false;
    return [wins, Math.round(time / runs), Math.round(hits / runs)];
  },
  simVoid: (b, runs = 3) => {         // phase two of the final boss on its own
    Object.assign(build, b); headless = true; let wins = 0, crushed = 0, time = 0;
    for (let k = 0; k < runs; k++) {
      setLevel(ARENAS - 1); launch(); pendingRebirth = true; checkEnd(H);
      while (state === 'battle' || state === 'ending') {
        stepPhysics(); checkEnd(H);
        if (player.energy >= 1 && !tstop) { const f = nearest(player); if (f && Math.hypot(f.x - player.x, f.z - player.z) < 4) castSkill(player); }
      }
      wins += won; crushed += player.crushed; time += simT;
    }
    headless = false;
    return [wins, crushed, Math.round(time / runs)];
  },
  ko: () => tops.forEach(a => { if (!a.isPlayer) { a.w = sgn(a.w); a.lastHitBy = player; a.lastHitT = simT; } }),
  voidTune: o => Object.assign(VOID_TUNE, o), eqSet: toks => { build.eq = { s: toks.map(k => k && { v: k.replace('^', ''), up: k.startsWith('^') }) }; syncEq(); },
  tier: n => { tierOverride = n; }, eulerPass: v => { eulerOverride = v; }, checkEuler, shards: () => shardsOwned(),
  toVoid: () => { if (state === 'shop') launch(); pendingRebirth = true; },
  last: () => ({ void: !!level.void, won, why: player.why, crushed: player.crushed, t: +simT.toFixed(1), foes: tops.filter(a => !a.isPlayer).map(a => [a.alive, Math.round(a.w)]) }),
  ts: () => tstop && { t: +tstop.t.toFixed(2), free: tstop.free, hit: tstop.hit, theta: tstop.theta, qte: tstop.qte, mark: +qteMark(tstop).toFixed(2) }, rebirthT: () => rebirth && +rebirth.t.toFixed(2),
  unlockAll: () => { unlocked = ARENAS - 1; unlockedT = LEVELS.length - ARENAS - 1; refreshShop(); },
  info: () => ({ state, level: levelIndex, t: +simT.toFixed(1), won, hits: stats.hits, maxHit: +stats.maxHit.toFixed(1),
    tops: tops.map(a => ({ n: a.name, alive: a.alive, why: a.why, w: Math.round(a.w), e: +a.energy.toFixed(2), max: a.stormMax, kos: a.kos, skill: a.skill, act: a.skillT > 0 ? a.active : null,
      x: +a.x.toFixed(1), z: +a.z.toFixed(1) })) }),
};

resize();
if (params.has('debug') && params.has('final')) { game.unlockAll(); setLevel(ARENAS - 1); }   // ?debug&story&final opens straight on the final boss
else setLevel(Math.min(unlocked, ARENAS - 1));
requestAnimationFrame(frame);
</script>
</body>
</html>
